<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="iooi Reference: Dynasty iooi History &amp; Stats">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Dynasty iooi History", async (main) => {
  const [all, timeline, streaks, home, week] = await Promise.all([load("all_time"), load("timeline"), load("streaks"), load("home"), load("week")]);
  // Top panels, after the reference sites' front pages: faces of the season's leading scorers, then standings and the lottery.
  const y = home.season;
  const face = (p) => {
    const img = h("img", { src: p.pos === "DEF" ? `https://sleepercdn.com/images/team_logos/nfl/${p.player.toLowerCase()}.png` : `https://sleepercdn.com/content/nfl/players/thumb/${p.player}.jpg`, alt: p.name, loading: "lazy", class: p.pos === "DEF" ? "logo" : null });
    img.addEventListener("error", () => img.replaceWith(h("span", {}, p.name)));
    return h("a", { href: `player.html?id=${p.player}`, "data-tip": `${p.name}, ${p.pos}: ${fmt.pts(p.pts)} points in ${p.gs} ${p.gs === 1 ? "start" : "starts"}` }, img);
  };
  const dots = (links) => h("p", { class: "links" }, links.flatMap((a, i) => [i ? " · " : "", a]));
  const lot = home.lottery;
  const panels = h("div", { class: "home" },
    h("div", { class: "panel" },
      h("h2", {}, h("a", { href: "players.html" }, "Every iooi Player")),
      h("div", { class: "body" },
        h("div", { class: "faces" }, home.scorers.map(face)),
        h("h3", {}, `${y} Scoring Leaders`),
        h("ol", { class: "scorers" }, home.scorers.map((p) => h("li", {}, pLink(p.player, p.name), h("small", {}, ` ${p.pos}`), h("b", {}, fmt.pts(p.pts))))),
        dots([h("a", { href: "players.html" }, "Player Register"), h("a", { href: "leaders.html" }, "Career & Season Leaders"), h("a", { href: "hof.html" }, "Hall of Fame Monitor"), h("a", { href: "nicknames.html" }, "Nicknames")]))),
    h("div", { class: "panel" },
      h("h2", {}, h("a", { href: "index.html#franchises" }, "Every iooi Team")),
      h("div", { class: "body" },
        h("h3", {}, `${y} iooi Standings`),
        dots([sLink(y, "Summary"), h("a", { href: `season.html?y=${y}#schedule-and-results` }, "Schedule"), L.current_week ? h("a", { href: "week.html" }, "This Week") : null, h("a", { href: `season.html?y=${y}#league-leaders` }, "Leaders"), h("a", { href: "ratings.html" }, "Elo Ratings")].filter(Boolean)),
        h("div", { class: "pair" },
          statTable({
            sortable: false, rows: home.standings, rowClass: (r) => (r.finish === 1 ? "champ" : r.seed === 7 ? "first" : null),
            columns: [
              { label: "Team", render: (r) => [tsLink(y, r.franchise, r.team), h("small", {}, ` (${r.seed})`)], title: "Team, with its seed" },
              { label: "W", render: (r) => r.w, num: true },
              { label: "L", render: (r) => r.l, num: true },
              { label: "PF", render: (r) => fmt.pts(r.pf), num: true },
            ],
          }),
          lot ? h("div", {}, statTable({
            sortable: false, rows: lot.rows,
            columns: [
              { label: `${lot.draft} Lottery`, render: (r) => fLink(r.franchise, r.team), title: "The six teams outside the playoffs, in lottery order" },
              { label: "Max PF", render: (r) => fmt.pts(r.max_pf), num: true },
              { label: "Odds", render: (r) => `${r.odds}%`, num: true, cls: "win", title: "Chance at the first pick" },
              { label: "Holder", render: (r) => (r.holder === r.franchise ? "own" : fLink(r.holder)), title: `Who holds the team's ${lot.draft} first-round pick` },
            ],
          }), h("p", { class: "note" }, [lot.final ? "Final lottery order. " : "If the season ended today. ", lot.basis === "max_pf" ? "Odds go to the non-playoff teams by Max PF, lowest first. " : "", h("a", { href: "tankathon/" }, "Tankathon"), " has the live order."])) : null),
        h("p", { class: "note" }, "Seeds 1-6 make the Dynasty Playoffs; the line marks the cut."))));
  // This week's games at a glance; the full preview is on its own page.
  if (week.matchups?.length) {
    const side = (x) => [tsLink(week.season, x.franchise, x.team), h("small", {}, ` (${x.w}-${x.l})`)];
    const live = week.matchups.some((m) => m.a.points || m.b.points);
    const stage = week.week <= 14 ? `Week ${week.week}` : `Week ${week.week} Postseason`;
    panels.append(h("div", { class: "panel wide" },
      h("h2", {}, h("a", { href: "week.html" }, "This Week in iooi")),
      h("div", { class: "body" },
        h("h3", {}, `${week.season} ${stage} Matchups`),
        statTable({
          sortable: false, rows: week.matchups,
          columns: [
            { label: "Matchup", render: (m) => [side(m.a), " vs ", side(m.b)], title: "Higher seed listed first" },
            { label: "Favorite", render: (m) => `${(m.a.chance >= m.b.chance ? m.a : m.b).team} ${fmt.eff(Math.max(m.a.chance, m.b.chance))}`, title: "The team Elo gives the better chance, and that chance" },
            { label: "Projected", render: (m) => `${fmt.pts(m.a.proj)} - ${fmt.pts(m.b.proj)}`, cls: "c", title: "Sleeper's projected score for the lineups as set" },
            live ? { label: "Score", render: (m) => `${fmt.pts(m.a.points)} - ${fmt.pts(m.b.points)}`, cls: "c win", title: "Score as of the last data refresh" } : null,
            { label: "Series", render: (m) => (m.history.games ? `${m.history.a_w}-${m.history.b_w}` : "First meeting"), cls: "c", title: "All-time record between the two, first team listed first" },
          ].filter(Boolean),
        }),
        dots([h("a", { href: "week.html" }, "Full previews, lineups and storylines"), h("a", { href: `season.html?y=${week.season}#schedule-and-results` }, "Schedule and results")]))));
  }
  // Events from earlier years that fell within three days of today's date.
  const today = new Date();
  const near = (date) => {
    const d = new Date(`${date}T12:00:00`);
    if (d.getFullYear() >= today.getFullYear()) return false;
    const then = new Date(today.getFullYear(), d.getMonth(), d.getDate(), 12);
    return Math.abs(then - today) <= 3.5 * 86400000;
  };
  const who = (m) => (m.kind === "player" ? `[[p:${m.key}|${m.name}]]` : m.kind === "manager" ? `[[m:${m.key}]]` : `[[f:${m.key}|${m.team}]]`);
  const memories = [
    ...timeline.events.filter((e) => near(e.date)).map((e) => ({ date: e.date, text: e.text })),
    ...streaks.milestones.reached.filter((m) => near(m.date) && m.kind !== "manager").map((m) => ({ date: m.date, text: `${who(m)} reaches ${m.what} ([[g:${m.game}]]).` })),
  ].sort((x, y) => (x.date < y.date ? 1 : -1)).slice(0, 8);
  const done = L.seasons.filter((s) => s.status === "complete");
  const team = (key) => (s) => (s[key] ? fLink(s[key], seasonTeam(s.season, s[key])) : "");
  main.append(
    h("p", { class: "lede" }, h("h1", {}, "iooi Stats and History"), ` Statistics, scores and history for Dynasty iooi, a twelve-team dynasty fantasy football league founded in ${L.founded}.`),
    panels,
    meta([
      ["Founded", L.founded],
      ["Franchises", L.franchises.length],
      ["Seasons", `${L.seasons.length} (${L.seasons[0].season} to ${L.current_season})`],
      ["Commissioner", mLink(L.commissioner)],
      ["Current season", [sLink(L.current_season), L.current_week ? [", ", h("a", { href: "week.html" }, `week ${L.current_week} matchups`)] : null]],
      ["Champions", done.map((s) => `${seasonTeam(s.season, s.champion)} (${s.season})`).join(", ")],
    ]),
    home.last_week?.lines.length && home.status !== "complete" ? h("div", { class: "onthisday" },
      h("b", { class: "head" }, `Last week in iooi: ${home.last_week.season} Week ${home.last_week.week}${home.last_week.kind === "regular" ? "" : " (postseason)"}`),
      h("ul", {}, home.last_week.lines.map((e) => h("li", {}, h("b", {}, `${e.label}: `), rich(e.text))))) : null,
    memories.length ? h("div", { class: "onthisday" }, h("b", { class: "head" }, "This week in iooi history"),
      h("ul", {}, memories.map((e) => h("li", {}, h("b", {}, `${e.date}: `), rich(e.text))))) : null,
    section("Champions", statTable({
      rows: [...L.seasons].reverse(),
      columns: [
        { label: "Season", value: (s) => s.season, render: (s) => sLink(s.season) },
        { label: "Champion", render: team("champion"), cls: "win" },
        { label: "Runner-up", render: team("runner_up") },
        { label: "Third place", render: team("third") },
        { label: "Top seed", render: team("top_seed"), title: "Best regular-season record" },
        { label: "Most points", render: team("most_points"), title: "Most regular-season points" },
        { label: "Ultimate Loser", render: team("ultimate_loser"), title: "Loser of the Toilet Bowl" },
      ],
    }), L.current_week > 1 ? h("p", { class: "note" }, `${L.current_season} is in progress; top seed and most points are through week ${L.current_week - 1}.`) : null),
    section("Franchises", statTable({
      rows: rank([...all.franchises].sort((a, b) => b.pct - a.pct || b.pf - a.pf), (f) => f.pct),
      columns: [
        { label: "Rk", value: (f) => f.rk, num: true },
        { label: "Franchise", value: (f) => f.name, render: (f) => fLink(f.id) },
        { label: "Manager(s)", render: (f) => mLinks(f.owners) },
        { label: "W", value: (f) => f.w, num: true },
        { label: "L", value: (f) => f.l, num: true },
        { label: "W-L%", value: (f) => f.pct, render: (f) => fmt.pct(f.pct), num: true },
        { label: "PF", value: (f) => f.pf, render: (f) => fmt.pts(f.pf), num: true, title: "Regular-season points for" },
        { label: "PA", value: (f) => f.pa, render: (f) => fmt.pts(f.pa), num: true, title: "Regular-season points against" },
        { label: "Trans", value: (f) => f.transactions, num: true, title: "Completed trades, waiver claims and free-agent moves" },
        { label: "Trades", value: (f) => f.trades, num: true },
        { label: "Plyf", value: (f) => f.playoff_appearances, num: true, title: "Playoff appearances" },
        { label: "Plyf W-L", value: (f) => f.playoff_w - f.playoff_l, render: (f) => `${f.playoff_w}-${f.playoff_l}`, num: true },
        { label: "Titles", value: (f) => f.championships.length, render: (f) => f.championships.join(", "), num: true },
        { label: "Ult. Loser", value: (f) => f.ultimate_loser.length, render: (f) => f.ultimate_loser.join(", "), num: true },
      ],
    }), h("p", { class: "note" }, "Records are regular season only. A franchise keeps its history when it changes hands.")),
    section("Managers", statTable({
      rows: rank([...all.managers].sort((a, b) => (b.pct ?? 0) - (a.pct ?? 0) || b.w - a.w), (m) => m.pct ?? 0),
      columns: [
        { label: "Rk", value: (m) => m.rk, num: true },
        { label: "Manager", value: (m) => m.name, render: (m) => mLink(m.id) },
        { label: "Franchise(s)", render: (m) => m.franchises.flatMap((id, i) => [i ? ", " : "", fLink(id)]) },
        { label: "Active", value: (m) => (m.active ? "Yes" : "No"), cls: "c" },
        { label: "W", value: (m) => m.w, num: true },
        { label: "L", value: (m) => m.l, num: true },
        { label: "W-L%", value: (m) => m.pct, render: (m) => fmt.pct(m.pct), num: true },
        { label: "PF", value: (m) => m.pf, render: (m) => fmt.pts(m.pf), num: true },
        { label: "PA", value: (m) => m.pa, render: (m) => fmt.pts(m.pa), num: true },
        { label: "Trans", value: (m) => m.transactions, num: true },
        { label: "Trades", value: (m) => m.trades, num: true },
        { label: "Plyf W-L", value: (m) => m.playoff_w - m.playoff_l, render: (m) => `${m.playoff_w}-${m.playoff_l}`, num: true },
        { label: "Titles", value: (m) => m.championships.length, render: (m) => m.championships.join(", "), num: true },
      ],
    }), h("p", { class: "note" }, "A manager is credited with every game played while holding a stake in the franchise. Co-managers share the same games.")));
});
</script>
</body>
</html>
