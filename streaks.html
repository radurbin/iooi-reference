<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Streaks &amp; Milestones | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Streaks & Milestones", async (main) => {
  const s = await load("streaks");
  const game = (x) => gLink(x.id, `${x.season} wk ${x.week}`);
  const streakCols = (who) => [
    { label: "Rk", value: (r) => r.rk, num: true },
    who,
    { label: "Streak", value: (r) => r.n, render: (r) => `${r.n} ${r.won ? (r.n === 1 ? "win" : "wins") : (r.n === 1 ? "loss" : "losses")}`, cls: "win" },
    { label: "From", value: (r) => r.from.id, render: (r) => game(r.from) },
    { label: "To", value: (r) => r.to.id, render: (r) => (r.active ? "active" : game(r.to)) },
    { label: "Team", value: (r) => r.team, title: "Team name when the streak ended, which may differ from the franchise's name today" },
  ];
  const fCol = { label: "Franchise", value: (r) => franchiseName(r.key), render: (r) => fLink(r.key) };
  const mCol = mgrCol();
  const playerCols = (unit) => [
    { label: "Rk", value: (r) => r.rk, num: true },
    { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name), cls: "win" },
    { label: "Pos", value: (r) => r.pos, cls: "c" },
    { label: "Streak", value: (r) => r.n, render: (r) => `${r.n} ${unit}`, cls: "win" },
    { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true, title: "Points during the streak" },
    { label: "From", value: (r) => r.from.id, render: (r) => game(r.from) },
    { label: "To", value: (r) => r.to.id, render: (r) => (r.active ? "active" : game(r.to)) },
    { label: "Team(s)", render: (r) => r.teams.join(", "), title: "Teams he started for during the streak" },
  ];
  const who = (m) => (m.kind === "player" ? pLink(m.key, m.name) : m.kind === "manager" ? mLinks(m.mgrs ?? [m.key]) : fLink(m.key, m.name));
  const kinds = { franchise: "Franchise", manager: "Manager", player: "Player" };
  const m = s.milestones;
  // Best stretches: one set of tables, redrawn for the chosen number of weeks.
  const st = s.stretches;
  const stretchBox = h("div");
  const spanOf = (r) => `Weeks ${r.from.week}-${r.to.week}`;
  const stretchCols = (who) => [
    { label: "Rk", value: (r) => r.rk, num: true },
    ...who,
    { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true, cls: "win", title: "Points over the stretch" },
    { label: "Avg", value: (r) => r.avg, render: (r) => fmt.pts(r.avg), num: true },
    { label: "Season", value: (r) => r.season, render: (r) => sLink(r.season) },
    { label: "Span", value: (r) => r.from.week, render: (r) => spanOf(r) },
    { label: "From", value: (r) => r.from.game, render: (r) => gLink(r.from.game, `wk ${r.from.week}`), title: "First game of the stretch" },
    { label: "To", value: (r) => r.to.game, render: (r) => gLink(r.to.game, `wk ${r.to.week}`), title: "Last game of the stretch" },
  ];
  const teamCol = { label: "Team", value: (r) => r.teams.join(", "), render: (r) => tsLink(r.season, r.franchise, r.teams.at(-1)), title: "Team name that season" };
  const drawStretch = (n) => {
    stretchBox.replaceChildren(
      h("p", {}, h("b", {}, "Consecutive weeks: "), st.spans.flatMap((x, i) => [i ? " · " : "", x === n ? h("b", {}, x) : h("a", { href: "#", onclick: (e) => { e.preventDefault(); drawStretch(x); } }, x)])),
      h("h3", {}, `Franchises: Most Points in ${n} Straight Weeks`), statTable({ rows: rank(st.franchises[n], (r) => r.pts), columns: stretchCols([{ label: "Franchise", value: (r) => franchiseName(r.key), render: (r) => fLink(r.key) }, teamCol]) }),
      h("h3", {}, `Players: Most Points in ${n} Straight Starts`), statTable({ rows: rank(st.players[n], (r) => r.pts), columns: stretchCols([
        { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name), cls: "win" }, { label: "Pos", value: (r) => r.pos, cls: "c" },
        { label: "Team(s)", value: (r) => r.teams.join(", "), title: "Teams he started for during the stretch" }]) }));
  };
  drawStretch(5);
  // Fastest to each player points milestone: one pair of tables, redrawn for the chosen players and milestone.
  const fastBox = h("div");
  const fastCols = (key, label, tip) => [
    { label: "Rk", value: (r) => r.rk, num: true },
    { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name), cls: "win" },
    { label: "Pos", value: (r) => r.pos, cls: "c" },
    { label, value: (r) => r[key], num: true, cls: "win", title: tip },
    { label: key === "starts" ? "Weeks" : "Starts", value: (r) => r[key === "starts" ? "weeks" : "starts"], num: true, title: key === "starts" ? "iooi weeks since his first week on an iooi roster" : "Starts it took" },
    ...(key === "weeks" ? [{ label: "Joined", value: (r) => `${r.first.season}-${String(r.first.week).padStart(2, "0")}`, render: (r) => `${r.first.season} wk ${r.first.week}`, title: "His first week on an iooi roster" }] : []),
    { label: "Reached", value: (r) => r.game, render: (r) => gLink(r.game, `${r.season} wk ${r.week}`), title: "The game he got there" },
    { label: "Team", value: (r) => r.team, render: (r) => tsLink(r.season, r.franchise, r.team), title: "Team he started for that week" },
  ];
  const groups = { all: "All players", rookies: "NFL rookies since 2023" };
  const drawFast = (group, mark) => {
    const fa = s.fastest[group];
    if (!fa.marks.includes(mark)) mark = fa.marks[0];
    const pickLinks = (items, on, label, go) => items.flatMap((x, i) => [i ? " · " : "", x === on ? h("b", {}, label(x)) : h("a", { href: "#", onclick: (e) => { e.preventDefault(); go(x); } }, label(x))]);
    fastBox.replaceChildren(
      h("p", {}, h("b", {}, "Players: "), pickLinks(Object.keys(groups), group, (g) => groups[g], (g) => drawFast(g, mark))),
      h("p", {}, h("b", {}, "Milestone: "), pickLinks(fa.marks, mark, (x) => x.toLocaleString(), (x) => drawFast(group, x))),
      h("p", { class: "note" }, `${fa.reached[mark]} ${group === "rookies" ? "players with an NFL rookie season of 2023 or later" : "players"} ${fa.reached[mark] === 1 ? "has" : "have"} reached ${mark.toLocaleString()} points.`),
      h("h3", {}, `Fewest Starts to ${mark.toLocaleString()} Points`), statTable({ rows: rank(fa.starts[mark], (r) => -r.starts), columns: fastCols("starts", "Starts", "Starts it took") }),
      h("h3", {}, `Fewest Weeks to ${mark.toLocaleString()} Points`), statTable({ rows: rank(fa.weeks[mark], (r) => -r.weeks), columns: fastCols("weeks", "Weeks", "iooi weeks from his first week on an iooi roster through the week he got there") }));
  };
  if (s.fastest.all.marks.length) drawFast("all", s.fastest.all.marks[0]);
  main.append(
    h("h1", {}, "Dynasty iooi Streaks & Milestones"),
    h("p", { class: "note" }, "Team streaks and milestones count regular-season and Dynasty Playoff games. Toilet Bowl games are left out, as in the Elo ratings."),
    section("Current Streaks", statTable({ rows: rank([...s.franchises.current].sort((x, y) => (y.won ? y.n : -y.n) - (x.won ? x.n : -x.n)), (r) => (r.won ? r.n : -r.n)), columns: streakCols(fCol).filter((c) => !["To", "Team"].includes(c.label)) })),
    section("Longest Winning Streaks", statTable({ rows: rank(s.franchises.wins, (r) => r.n), columns: streakCols(fCol) })),
    section("Longest Losing Streaks", statTable({ rows: rank(s.franchises.losses, (r) => r.n), columns: streakCols(fCol) })),
    section("Manager Winning Streaks", statTable({ rows: rank(mergeManagers(s.managers.wins), (r) => r.n), columns: streakCols(mCol) })),
    section("Manager Losing Streaks", statTable({ rows: rank(mergeManagers(s.managers.losses), (r) => r.n), columns: streakCols(mCol) })),
    section("Consecutive Starts", h("p", { class: "note" }, "Games in a row in an iooi starting lineup, in any lineup slot and for any franchise. An NFL bye week is skipped: it neither adds to the streak nor ends it. A week on the bench, or off every iooi roster, ends it."),
      statTable({ rows: rank(s.players.starts, (r) => r.n), columns: playerCols("starts") })),
    section(`Consecutive ${s.players.big_game}-Point Starts`, statTable({ rows: rank(s.players.big_games, (r) => r.n), columns: playerCols("starts") })),
    section("Best Stretches", h("p", { class: "note" }, "The most points over a run of consecutive weeks within one season, playoffs and Toilet Bowl included. A team or player appears more than once only for stretches that do not overlap. For players the weeks must all be starts; an NFL bye is skipped, and a week on the bench ends the run."), stretchBox),
    section("Playoff Runs and Droughts", statTable({
      rows: s.postseason,
      columns: [
        { label: "Franchise", value: (r) => franchiseName(r.franchise), render: (r) => fLink(r.franchise) },
        { label: "Plyf", value: (r) => r.appearances, render: (r) => `${r.appearances} of ${r.seasons}`, num: true, title: "Playoff appearances in completed seasons" },
        { label: "Current run", value: (r) => (r.in_playoffs ? r.streak : -r.streak), render: (r) => `${r.streak} ${r.in_playoffs ? "in a row" : (r.streak === 1 ? "season out" : "seasons out")}`, title: "Consecutive seasons in or out of the Dynasty Playoffs" },
        { label: "Titles", value: (r) => r.titles.length, render: (r) => r.titles.join(", "), title: "Championship seasons" },
        { label: "Since title", value: (r) => r.since_title ?? 99, render: (r) => (r.since_title == null ? "never" : r.since_title === 0 ? "reigning" : `${r.since_title} ${r.since_title === 1 ? "season" : "seasons"}`), title: "Completed seasons since the last championship" },
        { label: "Best finish", value: (r) => r.best_finish, render: (r) => `${ordinal(r.best_finish)} (${r.best_seasons.join(", ")})`, title: "Best final place and when" },
      ],
    })),
    section("Fastest to Player Milestones", h("p", { class: "note" }, "Points as a starter for any iooi franchise. Weeks count every iooi week (1 to 17 each season, playoffs included; the offseason is skipped) from the player's first week on an iooi roster, whether he came in by the startup draft, a rookie draft or free agency, through the week he got there. NFL rookies since 2023 shows only players whose first NFL season was 2023 or later, however they joined iooi, leaving out players who were already in the NFL before 2023."), fastBox),
    section("Next Milestones", statTable({
      rows: mergeManagers(m.upcoming, "key", { ignore: ["name"], when: (r) => r.kind === "manager" }),
      columns: [
        { label: "Type", value: (r) => kinds[r.kind], title: "Franchise, manager or player" },
        { label: "Name", value: (r) => r.name, render: who, cls: "win", title: "Who is closing in" },
        { label: "Milestone", value: (r) => r.what, title: "The next round number" },
        { label: "Has", value: (r) => r.have, render: (r) => (r.unit === "points" ? fmt.pts(r.have) : r.have), num: true, title: "Current total" },
        { label: "Needs", value: (r) => r.need, render: (r) => (r.unit === "points" ? fmt.pts(r.need) : r.need), num: true, title: "Amount still needed" },
      ],
    })),
    section("Milestones Reached", statTable({
      rows: mergeManagers(m.reached, "key", { ignore: ["name"], when: (r) => r.kind === "manager" }),
      columns: [
        { label: "Date", value: (r) => r.date },
        { label: "Type", value: (r) => kinds[r.kind], title: "Franchise, manager or player" },
        { label: "Name", value: (r) => r.name, render: who, cls: "win", title: "Who reached it" },
        { label: "Milestone", value: (r) => r.what, title: "The round number reached" },
        { label: "Fastest", value: (r) => (r.fastest ? 0 : 1), render: (r) => (r.fastest ? h("span", { class: "win" }, r.fastest.map((t) => t[0].toUpperCase() + t.slice(1)).join("; ")) : ""), title: "Still the fastest to this milestone: fewest starts or fewest weeks since his first week on an iooi roster, for all players or among NFL rookies since 2023" },
        { label: "Team", value: (r) => r.team },
        { label: "Game", render: (r) => gLink(r.game, `${r.season} wk ${r.week}`) },
      ],
    }), h("p", { class: "note" }, "Player milestones count starts and points as a starter for any iooi franchise. Fastest marks a player who still holds the record for reaching that points milestone in the fewest starts or weeks (see Fastest to Player Milestones above).")));
});
</script>
</body>
</html>
