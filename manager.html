<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Manager | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Manager", async (main) => {
  const mid = param("id") || L.commissioner;
  const [m, allTrades, players] = await Promise.all([load(`managers/${mid}`), load("trades"), load("players")]);
  const mine = m.stints.filter((s) => !s.to).map((s) => s.franchise);   // franchises he holds a stake in now
  const trades = allTrades.filter((x) => x.sides.some((s) => (s.managers ?? []).includes(mid)));
  const t = m.totals;
  const slotName = (slot) => ({ SUPER_FLEX: "Superflex", FLEX: "Flex" })[slot] ?? slot;
  const leaderCols = [
    { label: "Rk", value: (r) => r.rk, num: true },
    { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name), cls: activeCls(players, mine) },
    { label: "Pos", value: (r) => r.pos, cls: "c" },
    { label: "Years", value: (r) => r.years, cls: "c" },
    { label: "G", value: (r) => r.g, num: true },
    { label: "GS", value: (r) => r.gs, num: true },
    { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
    { label: "Pts/GS", value: (r) => r.pts / r.gs, render: (r) => fmt.pts(r.pts / r.gs), num: true },
    { label: "Best", value: (r) => r.best, render: (r) => fmt.pts(r.best), num: true },
    { label: "VOR", value: (r) => r.vor, render: (r) => fmt.pts1(r.vor), num: true },
    { label: "WAR", value: (r) => r.war, render: (r) => fmt.pts(r.war), num: true },
    { label: "W", value: (r) => r.wins, num: true, title: "Team wins in games he started" },
  ];
  main.append(
    h("div", { class: "crumbs" }, h("a", { href: "index.html#managers" }, "Managers"), ` › ${m.name}`),
    bio({
      name: m.name,
      awards: m.seasons.flatMap((s) => [
        s.result === "Champion" ? ["iooi Champ", s.season, "gold"] : null, s.result === "Runner-up" ? ["Runner-up", s.season] : null,
        s.result === "Ultimate Loser" ? ["Ultimate Loser", s.season, "red"] : null]).filter(Boolean),
      lines: [
        ["Position", m.id === L.commissioner ? "Manager and Commissioner" : m.stints.some((s) => s.to === null) ? "Manager" : "Former manager"],
        ["Franchises", [...new Set(m.stints.map((s) => s.franchise))].flatMap((id, i) => [i ? ", " : "", fLink(id)])],
        [["Record", t.pct == null ? "No games" : `${record(t)} (${fmt.pct(t.pct)} W-L%)`], ["Playoff Games", `${t.playoff_w}-${t.playoff_l}`]],
        ["Championships", m.championships.length ? `${m.championships.length} (${m.championships.join(", ")})` : "0"],
        ["Ultimate Loser", m.ultimate_loser.length ? m.ultimate_loser.join(", ") : null],
        [["Points For", t.pf == null ? null : fmt.pts(t.pf)], ["Transactions", t.transactions], ["Trades", t.trades]],
        ["First Stake", m.stints.map((s) => s.from).sort()[0]],
      ],
    }),
    section("Seasons", statTable({
      rows: [...m.seasons].reverse(), rowClass: (r) => (r.result === "Champion" ? "champ" : null),
      foot: { season: "Career", total: true, ...t },
      columns: [
        { label: "Season", value: (r) => r.season, render: (r) => (r.total ? r.season : tsLink(r.season, r.franchise, r.season)) },
        { label: "Franchise", render: (r) => (r.total ? "" : fLink(r.franchise, r.team)) },
        { label: "W", value: (r) => r.w, num: true },
        { label: "L", value: (r) => r.l, num: true },
        { label: "W-L%", value: (r) => r.pct, render: (r) => fmt.pct(r.pct), num: true },
        { label: "PF", value: (r) => r.pf, render: (r) => fmt.pts(r.pf), num: true },
        { label: "PA", value: (r) => r.pa, render: (r) => fmt.pts(r.pa), num: true },
        { label: "Trans", value: (r) => r.transactions, num: true },
        { label: "Trades", value: (r) => r.trades, num: true },
        { label: "Plyf W-L", render: (r) => (r.playoff_w + r.playoff_l ? `${r.playoff_w}-${r.playoff_l}` : ""), num: true },
        { label: "Finish", render: (r) => r.result ?? "", cls: "c" },
        { label: "Notes", render: (r) => (r.partial_season ? "Partial season" : ""), cls: "dim" },
      ],
    })),
    m.leaders.overall.length ? [
      section("All-Time Leaders", statTable({ rows: rank(m.leaders.overall, (r) => r.pts), columns: leaderCols }),
        h("h3", {}, "Leaders by Position"), statTable({ sortable: false, rows: Object.values(m.leaders.by_pos).flatMap((rows) => rank(rows, (r) => r.pts)), groupBy: (r) => r.pos, columns: leaderCols }),
        h("p", { class: "note" }, `Games started and points for a franchise while ${m.name} held a stake in it. Bold marks a player on one of ${m.name}'s rosters now.`)),
      section("All-Time Team", statTable({
        sortable: false, rows: m.all_time_team,
        columns: [
          { label: "Slot", render: (r) => slotName(r.slot), cls: "win" },
          { label: "Player", render: (r) => pLink(r.player, r.name), cls: activeCls(players, mine) },
          { label: "Pos", render: (r) => r.pos, cls: "c" },
          { label: "Years", render: (r) => r.years, cls: "c" },
          { label: "GS", render: (r) => r.gs, num: true },
          { label: "Pts", render: (r) => fmt.pts(r.pts), num: true },
          { label: "WAR", render: (r) => fmt.pts(r.war), num: true },
        ],
      }), h("p", { class: "note" }, `The best lineup from everyone who has started for ${m.name}, by starter points under this manager.`)),
      section("Best Single Games", statTable({
        rows: rank(m.best_games, (r) => r.pts),
        columns: [
          { label: "Rk", value: (r) => r.rk, num: true },
          { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name) },
          { label: "Pos", value: (r) => r.pos, cls: "c" },
          { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
          { label: "Team", value: (r) => r.team, render: (r) => fLink(r.franchise, r.team) },
          { label: "Game", value: (r) => r.game, render: (r) => gLink(r.game, `${r.season} wk ${r.week}`) },
        ],
      })),
    ] : null,
    section("Franchise Stakes", statTable({
      sortable: false, rows: m.stints,
      columns: [
        { label: "Franchise", render: (s) => fLink(s.franchise) },
        { label: "Acquired stake", value: (s) => s.from },
        { label: "Sold stake", render: (s) => s.to ?? "present" },
      ],
    })),
    section("Trade History", trades.length ? statTable({
      rows: trades,
      columns: [
        { label: "Date", value: (x) => x.date },
        { label: "When", value: (x) => `${x.season} ${String(x.week ?? 0).padStart(2, "0")}`, render: (x) => (x.week ? `${x.season} wk ${x.week}` : `${x.season} offseason`) },
        { label: "Terms", render: (x) => tradeTerms(x, players) },
        tradeStatus,
        { label: "", render: (x) => tLink(x.id, "details") },
      ],
    }) : h("p", { class: "note" }, "No trades."),
      h("p", { class: "note" }, ["Every trade made by a franchise while this manager held a stake in it, newest first, including those vetoed or withdrawn. Team names are as they were at the time. See also the ", h("a", { href: "trade_records.html" }, "trade records"), "."])));
  return m.name;
});
</script>
</body>
</html>
