// A line chart of a player's Hall of Fame Monitor score week by week, with a band for each season and the benchmark line.
function hofChart(hof) {
  const pts = hof.history, W = 760, H = 230, L = 40, R = 10, T = 12, B = 34;
  const top = Math.max(...pts.map((x) => x[2]));
  // Every player gets the same scale up to just past the benchmark, so the strong-candidate line is always in view; a higher score extends it.
  const showBench = true;
  const raw = Math.max(top, hof.benchmark) * 1.08;
  const step = [1, 2, 5, 10, 20, 25, 50, 100].find((s) => raw / s <= 6) ?? 100;
  const max = Math.ceil(raw / step) * step;
  const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const out = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hall of Fame Monitor score by week">`];
  for (let v = 0; v <= max; v += step) out.push(`<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ylab" x="${L - 6}" y="${y(v) + 4}">${v}</text>`);
  const seasons = [...new Set(pts.map((x) => x[0]))];
  seasons.forEach((season, n) => {
    const idx = pts.map((x, i) => (x[0] === season ? i : -1)).filter((i) => i >= 0);
    const a = idx[0] ? (x(idx[0] - 1) + x(idx[0])) / 2 : L, b = idx.at(-1) < pts.length - 1 ? (x(idx.at(-1)) + x(idx.at(-1) + 1)) / 2 : W - R;
    if (n % 2) out.splice(1, 0, `<rect class="band" x="${a}" y="${T}" width="${b - a}" height="${H - T - B}"/>`);
    out.push(`<text class="xlab" x="${(a + b) / 2}" y="${H - B + 18}">${season}</text>`);
  });
  if (showBench) out.push(`<line class="bench" x1="${L}" x2="${W - R}" y1="${y(hof.benchmark)}" y2="${y(hof.benchmark)}"/><text class="benchlab" x="${L + 6}" y="${y(hof.benchmark) - 5}">Strong candidate (${hof.benchmark})</text>`);
  out.push(`<polyline class="line" points="${pts.map((p, i) => `${x(i)},${y(p[2])}`).join(" ")}"/>`);
  pts.forEach((p, i) => out.push(`<circle class="dot" cx="${x(i)}" cy="${y(p[2])}" r="${pts.length > 40 ? 2 : 3}"/>`));
  out.push(`<line class="guide" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="hot" r="5" visibility="hidden"/>`);
  out.push(`<rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}"/></svg>`);
  const box = h("div", { class: "chartbox" });
  box.innerHTML = out.join("");
  const svg = box.firstChild, guide = svg.querySelector(".guide"), hot = svg.querySelector(".hot");
  const tip = h("div", { class: "charttip", hidden: true });
  box.append(tip);
  // Hover (or touch): the nearest week's score, and the change from the week before.
  const show = (ev) => {
    const r = svg.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(pts.length === 1 ? 0 : ((sx - L) / (W - L - R)) * (pts.length - 1))));
    const [season, week, score] = pts[i];
    const change = i ? score - pts[i - 1][2] : null;
    guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i)); guide.setAttribute("visibility", "visible");
    hot.setAttribute("cx", x(i)); hot.setAttribute("cy", y(score)); hot.setAttribute("visibility", "visible");
    tip.replaceChildren(h("b", {}, `${season} Week ${week}`), h("br"), `Monitor: ${score.toFixed(2)}`,
      ...(change ? [h("br"), h("span", { class: change > 0 ? "up" : "down" }, `${change > 0 ? "+" : ""}${change.toFixed(2)} from the week before`)] : []));
    tip.hidden = false;
    const px = (x(i) / W) * r.width, py = (y(score) / H) * r.height;
    tip.style.left = `${Math.min(Math.max(px - tip.offsetWidth / 2, 0), r.width - tip.offsetWidth)}px`;
    tip.style.top = `${py - tip.offsetHeight - 12 < 0 ? py + 14 : py - tip.offsetHeight - 12}px`;
  };
  const hide = () => { tip.hidden = true; guide.setAttribute("visibility", "hidden"); hot.setAttribute("visibility", "hidden"); };
  const hit = svg.querySelector(".hit");
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
  return box;
}

page("Player", async (main) => {
  const p = await load(`players/${param("id")}`);
  const t = p.totals;
  const height = p.height && /^\d+$/.test(p.height) ? `${Math.floor(p.height / 12)}-${p.height % 12}` : null;
  const moves = {
    draft: (e) => ["Drafted by ", fLink(e.to, e.to_team), `: ${e.detail}`],
    traded: (e) => ["Traded from ", fLink(e.from, e.from_team), " to ", fLink(e.to, e.to_team), e.trade ? [" (", tLink(e.trade, "trade details"), ")"] : ""],
    signed: (e) => ["Signed as a free agent by ", fLink(e.to, e.to_team)],
    claimed: (e) => ["Claimed off waivers by ", fLink(e.to, e.to_team)],
    released: (e) => ["Released by ", fLink(e.from, e.from_team)],
    reassigned: (e) => ["Assigned by the commissioner from ", fLink(e.from, e.from_team), " to ", fLink(e.to, e.to_team)],
    vetoed: (e) => h("span", { class: "dim" }, "Trade ", e.from ? ["from ", fLink(e.from, e.from_team), " "] : "", "to ", fLink(e.to, e.to_team), " vetoed by league vote (", tLink(e.trade, "trade details"), ")"),
    withdrawn: (e) => h("span", { class: "dim" }, "Trade ", e.from ? ["from ", fLink(e.from, e.from_team), " "] : "", "to ", fLink(e.to, e.to_team), " withdrawn during the league review (", tLink(e.trade, "trade details"), ")"),
  };
  const starts = p.log.filter((r) => r.started);
  // Bold marks a season in which he led the league in the stat (black ink).
  const ink = (r, cat) => !r.total && p.career.filter((c) => c.season === r.season).length === 1 && p.black_ink?.leads[r.season]?.includes(cat);
  const debut = starts[0];
  const last = p.log.at(-1);
  const nicks = [...new Set((p.nicknames ?? []).filter((n) => n.nickname).map((n) => n.nickname))];
  const age = p.birth_date && Math.floor((Date.now() - new Date(p.birth_date)) / 31557600000);
  const awards = p.honors.map((text) => {
    const [, year, what] = text.match(/^(\d{4}) (.*)$/) ?? [null, "", text];
    if (what.startsWith("All-iooi")) return ["All-iooi", year];
    if (what.startsWith("champion")) return ["iooi Champ", year, "gold"];
    if (what === "Championship MVP") return ["Championship MVP", year, "gold"];
    if (what.includes("MVP")) return ["MVP", year, "gold"];
    if (what.startsWith("Young Sexy")) return ["Young Sexy", year];
    return [what, year];
  });
  // Honors by season for the career table and the Awards section. A title belongs to the row for the title team; the rest to the season.
  const short = (what) => (what.startsWith("champion") ? "Champ" : what === "Championship MVP" ? "CMVP" : what.includes("MVP") ? "MVP" : what.endsWith("First Team") ? "All-iooi 1st"
    : what.endsWith("Second Team") ? "All-iooi 2nd" : what === "Rookie of the Year" ? "ROY" : what.startsWith("Young Sexy") ? "YS" : what);
  const full = (what) => (what.startsWith("champion") ? "iooi Champion" : what.startsWith("Young Sexy") ? `Young Sexy Award (${what.split(" ").at(-1)})` : what);
  const honors = p.honors.map((text) => { const [, season, what] = text.match(/^(\d{4}) (.*)$/) ?? [null, "", text]; return { season, what, champTeam: what.match(/^champion \((.*)\)$/)?.[1] }; });
  const order = ["MVP", "CMVP", "All-iooi 1st", "All-iooi 2nd", "ROY", "YS", "Champ"];
  honors.sort((a, b) => (a.season < b.season ? -1 : a.season > b.season ? 1 : order.indexOf(short(a.what)) - order.indexOf(short(b.what))));
  const rowHonors = (r) => {
    const mine = p.career.filter((x) => x.season === r.season);
    const main = mine.reduce((best, x) => (x.gs > best.gs ? x : best), mine[0]);   // the season's honors sit on the row with the most starts
    // MVP and Rookie of the Year races show his place, as in "MVP-4"; the winner is "MVP-1".
    const places = r === main ? (p.votes ?? []).filter((v) => v.startsWith(`${r.season} `)).map((v) => v.slice(5)) : [];
    const raced = new Set(places.map((v) => v.split("-")[0]));
    const items = honors.filter((a) => a.season === r.season && (a.champTeam ? a.champTeam === r.team : r === main)).map((a) => short(a.what)).filter((x) => !raced.has(x)).concat(places);
    const key = (x) => order.indexOf(x.split("-")[0]);
    return items.sort((a, b) => key(a) - key(b)).join(", ");
  };
  const awardRows = honors.map((a) => {
    const rows = p.career.filter((r) => r.season === a.season && (!a.champTeam || r.team === a.champTeam));
    const sum = (k) => rows.reduce((n, r) => n + (r[k] ?? 0), 0);
    return { ...a, rows, gs: sum("gs"), pts: sum("pts"), paa: sum("paa"), war: sum("war") };
  });
  // One tile per spell with a franchise, in the order he played for them, in the manner of uniform-number tiles.
  const stints = [];
  for (const row of p.log) {
    let tile = stints.at(-1);
    if (!tile || tile.franchise !== row.franchise) tile = stints[stints.push({ franchise: row.franchise, team: row.team, seasons: [] }) - 1];
    tile.team = row.team;
    if (!tile.seasons.includes(row.season)) tile.seasons.push(row.season);
  }
  const initials = (name) => (name.match(/[A-Za-z0-9]+/g) ?? ["?"]).map((w) => w[0].toUpperCase()).join("").slice(0, 4);
  const span = (seasons) => (seasons.length > 1 ? `${seasons[0].slice(2)}-${seasons.at(-1).slice(2)}` : `'${seasons[0].slice(2)}`);
  const ranks = p.ranks ?? [];
  const at = (scope, stat) => ranks.find((r) => r.group === "Career" && r.scope === scope && r.stat === stat);
  const standing = [[at("League", "Points"), "in points"], [at(`All ${p.pos}s`, "Points"), `among ${p.pos}s`], [at("League", "WAR"), "in WAR"], [at("League", "Games Started"), "in starts"]]
    .filter(([r]) => r).map(([r, text]) => `${ordinal(r.rank)} ${text}`);
  const rankRows = ranks.map((r, i) => ({ ...r, first: i === 0 || ranks[i - 1].group !== r.group || ranks[i - 1].scope !== r.scope }));
  const sum = (rows, f) => rows.reduce((s, r) => s + f(r), 0);
  const split = (group, label, rows) => {
    if (!rows.length) return null;
    const proj = rows.filter((r) => r.proj != null);
    return { group, label, gs: rows.length, pts: sum(rows, (r) => r.pts), best: Math.max(...rows.map((r) => r.pts)), low: Math.min(...rows.map((r) => r.pts)),
      vs: proj.length ? sum(proj, (r) => r.pts - r.proj) / proj.length : null, w: rows.filter((r) => r.won).length, l: rows.filter((r) => !r.won).length };
  };
  const by = (group, key, label = (k) => k) => [...new Set(starts.map(key))].map((k) => split(group, label(k), starts.filter((r) => key(r) === k)));
  const stage = { regular: "Regular season", winners: "Dynasty Playoffs", toilet: "Toilet Bowl" };
  const splits = [
    split("Total", "All starts", starts),
    split("Result", "Team wins", starts.filter((r) => r.won)), split("Result", "Team losses", starts.filter((r) => !r.won)),
    ...Object.entries(stage).map(([k, label]) => split("Stage", label, starts.filter((r) => r.kind === k))),
    split("Weeks", "Weeks 1-7", starts.filter((r) => r.week <= 7)), split("Weeks", "Weeks 8-14", starts.filter((r) => r.week > 7 && r.week <= 14)), split("Weeks", "Weeks 15-17", starts.filter((r) => r.week > 14)),
    ...by("Lineup slot", (r) => r.slot ?? "", (k) => k.replace("SUPER_FLEX", "Superflex").replace("FLEX", "Flex")),
    ...by("Season", (r) => r.season),
    ...by("Franchise", (r) => r.franchise, (k) => franchiseName(k)),
    ...by("Opponent", (r) => r.opp, (k) => franchiseName(k)).sort((a, b) => b.gs - a.gs),
  ].filter(Boolean).map((r, i, all) => ({ ...r, first: i === 0 || all[i - 1].group !== r.group }));
  main.append(
    h("div", { class: "crumbs" }, h("a", { href: "players.html" }, "Players"), ` › ${p.name}`),
    bio({
      name: p.name,
      photo: p.pos === "DEF" ? `https://sleepercdn.com/images/team_logos/nfl/${p.id.toLowerCase()}.png` : `https://sleepercdn.com/content/nfl/players/thumb/${p.id}.jpg`,
      logo: p.pos === "DEF",
      awards,
      tiles: stints.map((x) => h("a", { href: `franchise.html?id=${x.franchise}`, "data-tip": `${x.team}, ${x.seasons.length > 1 ? `${x.seasons[0]}-${x.seasons.at(-1)}` : x.seasons[0]}` }, initials(x.team), h("small", {}, span(x.seasons)))),
      lines: [
        nicks.length ? [null, `(${nicks.join(", ")})`] : null,
        [[p.positions ? "Positions" : "Position", p.positions?.join("/") ?? p.pos], ["NFL team", p.nfl_team ?? (p.pos === "DEF" ? null : "None")]],
        [null, height && p.weight ? `${height}, ${p.weight}lb` : null],
        // The team that holds him today, from the current rosters, even before he has spent a game week there.
        p.status?.code === "rostered" ? ["iooi Team", fLink(p.status.franchise, seasonTeam(L.current_season, p.status.franchise))] : ["Last iooi team", last && fLink(last.franchise, last.team)],
        ["iooi Status", p.status && (p.status.code === "rostered" ? null : p.status.code === "free_agent" ? "Free agent" : `Not on an iooi roster and without an NFL team${p.status.last_nfl ? `; last played in the NFL in ${p.status.last_nfl}` : ""}`)],
        ["Born", p.birth_date && `${p.birth_date}${age ? ` (Age: ${age})` : ""}`],
        ["College", p.college],
        ["NFL rookie year", p.rookie_year],
        ["iooi Draft", p.drafted && [fLink(p.drafted.franchise, p.history.find((e) => e.type === "draft")?.to_team), ", pick ", pickLink(p.drafted.season, p.drafted.label), ` (${ordinal(p.drafted.overall)} overall), `,
          h("a", { href: `draft.html?y=${p.drafted.season}` }, `${p.drafted.season} ${p.drafted.kind === "startup" ? "Startup" : "Rookie"} Draft`)]],
        ["iooi Debut", debut && [gLink(debut.game, debut.date), " for ", fLink(debut.franchise, debut.team)]],
        ["All-Time Ranks", standing.length ? standing.join(", ") : null],
        ["Hall of Fame Monitor", p.hof && [`${p.hof.score.toFixed(2)} (${ordinal(p.hof.rank)} of ${p.hof.of}; `, h("a", { href: "#hall-of-fame-monitor" }, "over time"), ", ", h("a", { href: "hof.html#hall-of-fame-monitor" }, "full list"), ")"]],
        ["Black Ink", p.black_ink && [`${p.black_ink.score} (${ordinal(p.black_ink.rank)} all-time; `, h("a", { href: "leaders.html#black-ink" }, "what is this?"), ")"]],
        ["iooi Career", `${t.gs} starts, ${fmt.pts(t.pts)} points${t.ppg == null ? "" : `, ${fmt.pts(t.ppg)} per start`}, ${fmt.pts(t.war)} WAR`],
      ],
    }),
    section("iooi Career", statTable({
      rows: p.career, foot: { season: "Career", total: true, ...t },
      columns: [
        { label: "Season", value: (r) => r.season, render: (r) => (r.total ? r.season : r.franchise ? tsLink(r.season, r.franchise, r.season) : sLink(r.season)) },
        { label: "Franchise", value: (r) => r.team, render: (r) => (r.total ? "" : fLink(r.franchise, r.team)) },
        { label: "NFL", value: (r) => (r.total ? "" : r.nfl ?? (r.season === L.current_season ? p.nfl_team : null) ?? ""), cls: "c", title: "NFL team or teams he played for that season" },
        { label: "G", value: (r) => r.g, num: true, title: "Weeks on the roster" },
        { label: "GS", value: (r) => r.gs, num: true, title: "Games started" },
        { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true, cls: (r) => (ink(r, "pts") ? "ink" : null), title: "Points as a starter" },
        { label: "Pts/GS", value: (r) => r.ppg, render: (r) => fmt.pts(r.ppg), num: true, cls: (r) => (ink(r, "ppg") ? "ink" : null) },
        { label: "Best", value: (r) => r.best, render: (r) => fmt.pts(r.best), num: true },
        { label: "Bench Pts", value: (r) => r.bench_pts, render: (r) => fmt.pts(r.bench_pts), num: true },
        { label: "W", value: (r) => r.wins, num: true, title: "Team wins in games he started" },
        { label: "PAA", value: (r) => r.paa, render: (r) => fmt.pts1(r.paa), num: true, title: "Points above the average iooi starter at his position" },
        { label: "VOR", value: (r) => r.vor, render: (r) => fmt.pts1(r.vor), num: true, title: "Value over a replacement-level player at his position" },
        { label: "WAR", value: (r) => r.war, render: (r) => fmt.pts(r.war), num: true, cls: (r) => (ink(r, "war") ? "ink" : null), title: "Wins above replacement" },
        { label: "Awards", render: (r) => (r.total ? "" : rowHonors(r)), title: "MVP-n and ROY-n: his place in the MVP and Rookie of the Year races (MVP-1 won it). CMVP (Championship MVP), All-iooi 1st or 2nd team, YS (Young Sexy Award), Champ (on the title roster)" },
      ],
    })),
    p.black_ink ? h("p", { class: "note" }, "Bold marks a season in which he led the league.") : null,
    awardRows.length ? section("Awards", statTable({
      sortable: false, rows: awardRows,
      columns: [
        { label: "Season", render: (a) => sLink(a.season) },
        { label: "Award", render: (a) => h("a", { href: "awards.html" }, full(a.what)), cls: "win" },
        { label: "iooi Team", render: (a) => a.rows.flatMap((r, i) => [i ? ", " : "", tsLink(a.season, r.franchise, r.team)]) },
        { label: "GS", render: (a) => a.gs, num: true, title: "Starts that season for the team or teams shown" },
        { label: "Pts", render: (a) => fmt.pts(a.pts), num: true },
        { label: "Pts/GS", render: (a) => (a.gs ? fmt.pts(a.pts / a.gs) : ""), num: true },
        { label: "PAA", render: (a) => fmt.pts1(a.paa), num: true, title: "Points above the average iooi starter at his position" },
        { label: "WAR", render: (a) => fmt.pts(a.war), num: true, title: "Wins above replacement" },
      ],
    }), h("p", { class: "note" }, "The figures are his season as an iooi starter for the team or teams shown. A Young Sexy Award is decided on NFL points over weeks 1-17, started or not.")) : null,
    p.hof ? section("Hall of Fame Monitor", h("div", { class: "chart" }, hofChart(p.hof)),
      h("p", { class: "note" }, [`His Monitor score after each iooi week. Today it is ${p.hof.score.toFixed(2)}: ${p.hof.war.toFixed(2)} for value, ${p.hof.starts.toFixed(2)} for service, ${p.hof.black_ink.toFixed(2)} for Black Ink and ${p.hof.awards.toFixed(2)} for honors. `,
        "Value and service build week by week; Black Ink, awards and titles count once their season is complete. ",
        `${p.hof.benchmark} marks a strong candidate. See the `, h("a", { href: "hof.html#hall-of-fame-monitor" }, "Hall of Fame Monitor"), "."])) : null,
    starts.length ? section("Splits", statTable({
      sortable: false, rows: splits, rowClass: (r) => (r.first ? "first" : null),
      columns: [
        { label: "Split", render: (r) => (r.first ? r.group : ""), cls: "win" },
        { label: "Value", render: (r) => r.label, title: "The group of starts counted in the row" },
        { label: "GS", value: (r) => r.gs, num: true },
        { label: "Pts", render: (r) => fmt.pts(r.pts), num: true },
        { label: "Pts/GS", render: (r) => fmt.pts(r.pts / r.gs), num: true },
        { label: "Best", render: (r) => fmt.pts(r.best), num: true },
        { label: "Low", render: (r) => fmt.pts(r.low), num: true },
        { label: "vs Proj", render: (r) => fmt.signed(r.vs), num: true },
        { label: "Team W-L", render: (r) => `${r.w}-${r.l}`, cls: "c" },
      ],
    }), h("p", { class: "note" }, "Starts only. Opponents and franchises are listed under their current names.")) : null,
    p.records_held?.length ? section("Records Held", recordTable(p.records_held, { [p.id]: { name: p.name } }, { scope: true, holder: false, team: true }),
      h("p", { class: "note" }, ["First places he holds today: on the league's ", h("a", { href: "records.html" }, "record book"), " and leader lists, and on a franchise's own records (franchise shown in brackets)."])) : null,
    rankRows.length ? section("Places on the All-Time Lists", statTable({
      sortable: false, rows: rankRows, rowClass: (r) => (r.first ? "first" : null),
      columns: [
        { label: "List", render: (r) => (r.first ? (r.franchise ? fLink(r.franchise, r.scope) : r.season && r.group === "Season" && r.scope !== "All single seasons" ? sLink(r.season, r.scope) : r.scope) : ""), cls: "win",
          title: "The list: all of iooi, his position, a franchise he played for, or one season" },
        { label: "Stat", render: (r) => r.stat, title: "What the list ranks" },
        { label: "Value", render: (r) => r.value.toFixed(r.digits), num: true, title: "His figure" },
        { label: "Rank", render: (r) => ordinal(r.rank), num: true, cls: (r) => (r.rank <= 10 ? "win" : null), title: "His place on the list; ties share a place" },
        { label: "Of", render: (r) => r.of, num: true, cls: "dim", title: "Players on the list" },
      ],
    }), h("p", { class: "note" }, ["Starter points, starts and value for iooi franchises. Franchise lists count only his time with that team. Top-ten places are bold. Full lists: ",
      h("a", { href: "leaders.html" }, "league leaders"), "; each franchise page has its own."])) : null,
    p.similar?.length ? section("Similar Players", statTable({
      sortable: false, rows: p.similar,
      columns: [
        { label: "Player", render: (r) => pLink(r.player, r.name), cls: "win" },
        { label: "Sim", value: (r) => r.score, num: true },
        { label: "GS", value: (r) => r.gs, num: true },
        { label: "Pts", render: (r) => fmt.pts(r.pts), num: true },
        { label: "Pts/GS", render: (r) => fmt.pts(r.ppg), num: true },
        { label: "WAR", render: (r) => fmt.pts(r.war), num: true },
      ],
    }), h("p", { class: "note" }, `Players at ${p.pos} whose iooi careers look most alike in starts, points, points per start and WAR. 1000 would be identical.`)) : null,
    section("NFL Fantasy Seasons", statTable({
      rows: p.nfl,
      columns: [
        { label: "Season", value: (r) => r.season },
        { label: "NFL", value: (r) => r.team ?? "", cls: "c", title: "NFL team or teams he played for" },
        { label: "G", value: (r) => r.g, num: true },
        { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
        { label: "Pts/G", value: (r) => (r.g ? r.pts / r.g : null), render: (r) => (r.g ? fmt.pts(r.pts / r.g) : ""), num: true },
        { label: "Pos Rk", value: (r) => r.rank, render: (r) => `${p.pos}${r.rank}`, num: true, title: "Rank at his position in total points" },
      ],
    }), h("p", { class: "note" }, "Every NFL game in weeks 1-17, scored under the iooi scoring rules of that week, whether or not he was on a roster or in a lineup.")),
    section("Transactions", p.history.length ? h("ul", { class: "meta" }, p.history.map((e) => h("li", {}, h("b", {}, `${e.date}: `), moves[e.type](e)))) : h("p", { class: "note" }, "None on record.")),
    p.nicknames?.length ? section("Nickname History", statTable({
      sortable: false, rows: p.nicknames,
      columns: [
        { label: "Date", value: (r) => r.date },
        { label: "Nickname", render: (r) => r.nickname ?? h("span", { class: "dim" }, "removed"), cls: "win", title: "Nickname given; \"removed\" when the manager cleared it" },
        { label: "Replaced", value: (r) => r.previous ?? "", cls: "dim", title: "The same manager's earlier nickname for the player" },
        { label: "By", render: (r) => mLink(r.manager) },
        { label: "Team", render: (r) => (r.franchise ? fLink(r.franchise, r.team) : "") },
      ],
    }), h("p", { class: "note" }, ["From the league's Sleeper notices. See the full ", h("a", { href: "nicknames.html" }, "nickname register"), "."])) : null,
    section("Game Log", statTable({
      rows: [...p.log].reverse(),
      columns: [
        { label: "Season", value: (r) => r.season },
        { label: "Week", value: (r) => r.week, num: true },
        { label: "Franchise", value: (r) => r.team, render: (r) => fLink(r.franchise, r.team) },
        { label: "Role", value: (r) => (r.started ? "Starter" : r.game ? "Bench" : "No game"), cls: (r) => (r.started ? "c win" : "c dim") },
        { label: "Proj", value: (r) => r.proj, render: (r) => fmt.pts(r.proj), num: true, cls: "dim" },
        { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
        { label: "Team result", value: (r) => (r.won == null ? "" : r.won ? "W" : "L"), cls: "c" },
        { label: "", render: (r) => (r.game ? gLink(r.game, "box score") : "") },
      ],
    })));
  return p.name;
});
</script>
