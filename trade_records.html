<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Trade Records | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Trade Records", async (main) => {
  const [t, players] = await Promise.all([load("trade_records"), load("players")]);
  const cols = (lead) => [
    lead,
    { label: "Trades", value: (r) => r.trades, num: true },
    { label: "W", value: (r) => r.w, num: true, title: "Trades where his side has more points from acquired starters" },
    { label: "L", value: (r) => r.l, num: true },
    { label: "Even", value: (r) => r.even, num: true, title: "Neither side has produced a starter point yet" },
    { label: "Pts In", value: (r) => r.pts_in, render: (r) => fmt.pts(r.pts_in), num: true, title: "Starter points from assets acquired" },
    { label: "Pts Out", value: (r) => r.pts_out, render: (r) => fmt.pts(r.pts_out), num: true, title: "Starter points the other side got from assets given up" },
    { label: "Net", value: (r) => r.net, render: (r) => fmt.signed(r.net), num: true },
    { label: "Vetoed", value: (r) => r.vetoed, num: true, title: "Trades blocked by league vote" },
  ];
  const ids = L.franchises.map((f) => f.id);
  const count = (a, b) => t.partners.find((p) => (p.a === a && p.b === b) || (p.a === b && p.b === a))?.trades ?? 0;
  const grid = h("table", { class: "stats grid" },
    h("thead", {}, h("tr", {}, h("th", { "data-tip": "Trades between the row franchise and each numbered franchise" }, ""), ids.map((id, i) => h("th", { "data-tip": franchiseName(id) }, i + 1)), h("th", { "data-tip": "Trades with all partners" }, "Total"))),
    h("tbody", {}, ids.map((a, i) => h("tr", {}, h("th", { class: "rowhead" }, `${i + 1}. `, fLink(a)),
      ids.map((b) => h("td", { class: a === b ? "num self" : "num" }, a === b ? "" : count(a, b) || "")),
      h("td", { class: "num win" }, ids.reduce((sum, b) => sum + (a === b ? 0 : count(a, b)), 0))))));
  main.append(
    h("h1", {}, "Dynasty iooi Trade Records"),
    h("p", { class: "note" }, "A trade is scored by the points each side has had from the players it acquired, as starters, since the deal. Picks count once used by the team that acquired them. Unused picks carry no value yet, so recent deals for future picks look one-sided."),
    section("Trade Record by Manager", statTable({ rows: t.managers, columns: cols({ label: "Manager", value: (r) => managerName(r.key), render: (r) => mLink(r.key) }) })),
    section("Trade Record by Franchise", statTable({ rows: t.franchises, columns: cols({ label: "Franchise", value: (r) => franchiseName(r.key), render: (r) => fLink(r.key) }) })),
    section("Trade Partners", h("div", { class: "scroll" }, grid), h("p", { class: "note" }, "Completed trades between each pair of franchises. Column numbers match the row numbers.")),
    section("Most Lopsided Trades", statTable({
      rows: rank(t.lopsided, (r) => r.margin),
      columns: [
        { label: "Rk", value: (r) => r.rk, num: true },
        { label: "Date", value: (r) => r.date },
        { label: "Ahead", value: (r) => r.winner_team, render: (r) => fLink(r.winner, r.winner_team), cls: "win" },
        { label: "Pts", value: (r) => r.winner_pts, render: (r) => fmt.pts(r.winner_pts), num: true },
        { label: "Behind", value: (r) => r.loser_team, render: (r) => fLink(r.loser, r.loser_team) },
        { label: "Pts", value: (r) => r.loser_pts, render: (r) => fmt.pts(r.loser_pts), num: true },
        { label: "Margin", value: (r) => r.margin, render: (r) => fmt.pts(r.margin), num: true },
        { label: "", render: (r) => tLink(r.id, "details") },
      ],
    })),
    section("Most Traded Players", statTable({
      rows: rank(t.most_traded, (r) => r.trades),
      columns: [{ label: "Rk", value: (r) => r.rk, num: true }, { label: "Player", value: (r) => players[r.player]?.name, render: (r) => pLink(r.player, players[r.player]?.name) },
        { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" }, { label: "Trades", value: (r) => r.trades, num: true }],
    })));
});
</script>
</body>
</html>
