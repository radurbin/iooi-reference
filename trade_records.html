<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Trade Records | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Trade Records", async (main) => {
  const [t, players] = await Promise.all([load("trade_records"), load("players")]);
  const cols = (lead) => [
    lead,
    { label: "Trades", value: (r) => r.trades, num: true },
    { label: "W", value: (r) => r.w, num: true, title: "Trades where this side received at least 0.25 WAR more value" },
    { label: "L", value: (r) => r.l, num: true, title: "Trades where the other side received at least 0.25 WAR more value" },
    { label: "Even", value: (r) => r.even, num: true, title: "Trades with neither side 0.25 WAR ahead" },
    { label: "Value In", value: (r) => r.war_in, render: (r) => fmt.pts(r.war_in), num: true, title: "NFL WAR of everything received, from each trade on" },
    { label: "Value Out", value: (r) => r.war_out, render: (r) => fmt.pts(r.war_out), num: true, title: "NFL WAR of everything given up, from each trade on" },
    { label: "Net", value: (r) => r.net, render: (r) => fmt.signed(r.net), num: true, cls: "win", title: "Value in minus value out, in WAR" },
    { label: "Pts In", value: (r) => r.pts_in, render: (r) => fmt.pts(r.pts_in), num: true, title: "Starter points this side got from the players it received (context)" },
    { label: "Pts Out", value: (r) => r.pts_out, render: (r) => fmt.pts(r.pts_out), num: true, title: "Starter points the other side got from what it received (context)" },
    { label: "Vetoed", value: (r) => r.vetoed, num: true, title: "Trades blocked by league vote" },
  ];
  const lopsidedCols = [
    { label: "Rk", value: (r) => r.rk, num: true },
    { label: "Date", value: (r) => r.date },
    { label: "Ahead", value: (r) => r.winner_team, render: (r) => fLink(r.winner, r.winner_team), cls: "win" },
    { label: "Value", value: (r) => r.winner_war, render: (r) => fmt.pts(r.winner_war), num: true, title: "NFL WAR received" },
    { label: "Behind", value: (r) => r.loser_team, render: (r) => fLink(r.loser, r.loser_team) },
    { label: "Value", value: (r) => r.loser_war, render: (r) => fmt.pts(r.loser_war), num: true, title: "NFL WAR received" },
    { label: "Margin", value: (r) => r.margin, render: (r) => fmt.pts(r.margin), num: true, cls: "win", title: "WAR margin" },
    { label: "", render: (r) => tLink(r.id, "details") },
  ];
  const ids = L.franchises.map((f) => f.id);
  const count = (a, b) => t.partners.find((p) => (p.a === a && p.b === b) || (p.a === b && p.b === a))?.trades ?? 0;
  const grid = h("table", { class: "stats grid" },
    h("thead", {}, h("tr", {}, h("th", { "data-tip": "Trades between the row franchise and each numbered franchise" }, ""), ids.map((id, i) => h("th", { "data-tip": franchiseName(id) }, i + 1)), h("th", { "data-tip": "Trades with all partners" }, "Total"))),
    h("tbody", {}, ids.map((a, i) => h("tr", {}, h("th", { class: "rowhead" }, `${i + 1}. `, fLink(a)),
      ids.map((b) => h("td", { class: a === b ? "num self" : "num" }, a === b ? "" : count(a, b) || "")),
      h("td", { class: "num win" }, ids.reduce((sum, b) => sum + (a === b ? 0 : count(a, b)), 0))))));
  main.append(
    h("h1", {}, "Dynasty iooi Trade Records"),
    h("p", { class: "note" }, ["A trade is judged by the value each side received: the NFL wins above replacement (WAR) of every player it got, in every game from the trade on, whoever rostered him, and for a pick, the WAR of the player it became from that draft on. A player below replacement counts as nothing rather than as a loss. What either team did afterwards, such as trading the player on, does not enter into it. A side is ahead once it leads by 0.25 WAR (about 21 points); until then the trade is even. Players still in the league and unused picks can change the result, so it is a verdict so far. Points in and out are the starter points each side got from what it received, for context. See the ", h("a", { href: "glossary.html#trade-result" }, "glossary"), "."]),
    section("Trade Record by Manager", statTable({ rows: mergeManagers(t.managers), columns: cols(mgrCol()) })),
    section("Trade Record by Franchise", statTable({ rows: t.franchises, columns: cols({ label: "Franchise", value: (r) => franchiseName(r.key), render: (r) => fLink(r.key) }) })),
    section("Trade Partners", h("div", { class: "scroll" }, grid), h("p", { class: "note" }, "Completed trades between each pair of franchises. Column numbers match the row numbers.")),
    section("Most Lopsided Trades", statTable({
      rows: rank(t.lopsided, (r) => r.margin),
      columns: lopsidedCols,
    })),
    section("Most Lopsided Trades by Season", h("p", { class: "note" }, "The ten widest margins among each season's completed trades. Trades are filed under the league year they were made in."),
      Object.entries(t.lopsided_by_season).reverse().map(([season, rows]) => [h("h3", {}, `${season} Season`), statTable({ rows: rank(rows, (r) => r.margin), columns: lopsidedCols })])),
    t.vetoed.length ? section("Vetoed and Withdrawn Trades", h("p", { class: "note" }, "Trades the league voted down, or that were withdrawn during the review, judged as if they had gone through: the NFL WAR of what each side would have received, from the trade on. The ranks place each one among the completed trades by margin."), statTable({
      rows: t.vetoed,
      columns: [
        { label: "Date", value: (r) => r.date },
        { label: "Status", value: (r) => (r.status === "vetoed" ? "Vetoed" : "Withdrawn"), cls: "c" },
        { label: "Ahead", value: (r) => r.sides[0].team, render: (r) => (r.leader ? fLink(r.sides[0].franchise, r.sides[0].team) : [fLink(r.sides[0].franchise, r.sides[0].team), h("span", { class: "dim" }, " (even)")]), cls: (r) => (r.leader ? "win" : null) },
        { label: "Value", value: (r) => r.sides[0].value, render: (r) => fmt.pts(r.sides[0].value), num: true, title: "NFL WAR it would have received" },
        { label: "Behind", value: (r) => r.sides[1]?.team, render: (r) => r.sides.slice(1).flatMap((s, i) => [i ? ", " : "", fLink(s.franchise, s.team)]) },
        { label: "Value", value: (r) => r.sides[1]?.value, render: (r) => fmt.pts(r.sides[1]?.value), num: true, title: "NFL WAR it would have received" },
        { label: "Margin", value: (r) => r.margin, render: (r) => fmt.pts(r.margin), num: true, cls: "win", title: "WAR margin" },
        { label: "All-Time Rk", value: (r) => r.lopsided?.all.rank, render: (r) => (r.lopsided ? `${ordinal(r.lopsided.all.rank)} of ${r.lopsided.all.of}` : ""), num: true, title: "Where its margin would place among all completed trades" },
        { label: "Season Rk", value: (r) => r.lopsided?.season.rank, render: (r) => (r.lopsided ? `${ordinal(r.lopsided.season.rank)} of ${r.lopsided.season.of}` : ""), num: true, title: "Where its margin would place among that season's completed trades" },
        { label: "Vote", value: (r) => r.votes?.veto ?? 0, render: (r) => (r.votes ? `${r.votes.veto ?? 0}-${r.votes.pass ?? 0}` : ""), cls: "c", title: "Votes to veto and to pass" },
        { label: "", render: (r) => tLink(r.id, "details") },
      ],
    })) : null,
    section("Most Traded Players", statTable({
      rows: rank(t.most_traded, (r) => r.trades),
      columns: [{ label: "Rk", value: (r) => r.rk, num: true }, { label: "Player", value: (r) => players[r.player]?.name, render: (r) => pLink(r.player, players[r.player]?.name) },
        { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" }, { label: "Trades", value: (r) => r.trades, num: true }],
    })));
});
</script>
</body>
</html>
