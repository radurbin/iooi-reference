<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Awards | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Awards", async (main) => {
  const [awards, players] = await Promise.all([load("awards"), load("players")]);
  const name = (id) => players[id]?.name ?? id;
  const team = (t) => (t ? fLink(t.franchise, t.team) : "");
  const teams = (r) => r.teams.flatMap((t, i) => [i ? ", " : "", fLink(t.franchise, t.team)]);
  const done = awards.filter((a) => a.complete);
  const slot = (s) => s.replace("SUPER_FLEX", "SFLX");
  main.append(
    h("h1", {}, "Dynasty iooi Awards and Honors"),
    h("p", { class: "note" }, "The championship ring, the Young Sexy Awards and the Ultimate Loser are set out in the constitution. MVP, Championship MVP, All-iooi teams and Rookie of the Year are computed by iooi Reference."),
    section("Champions and Team Honors", statTable({
      sortable: false, rows: awards,
      columns: [
        { label: "Season", render: (a) => sLink(a.season) },
        { label: "Champion", render: (a) => team(a.champion), cls: "win" },
        { label: "Championship MVP", render: (a) => (a.championship_mvp ? [pLink(a.championship_mvp.player, name(a.championship_mvp.player)), " (", gLink(a.championship_mvp.game, fmt.pts(a.championship_mvp.pts)), ")"] : ""), title: "Top scorer in the champion's starting lineup in the title game, team defenses excepted" },
        { label: "Runner-up", render: (a) => team(a.runner_up) },
        { label: "Top seed", render: (a) => team(a.top_seed) },
        { label: "Scoring title", render: (a) => [team(a.scoring_title), ` (${fmt.pts(a.scoring_title.value)})`] },
        { label: "Best lineup efficiency", render: (a) => [team(a.efficiency), ` (${fmt.eff(a.efficiency.value)})`] },
        { label: "Luckiest", render: (a) => [team(a.luckiest), ` (${fmt.signed(a.luckiest.value)})`] },
        { label: "Unluckiest", render: (a) => [team(a.unluckiest), ` (${fmt.signed(a.unluckiest.value)})`] },
        { label: "Ultimate Loser", render: (a) => team(a.ultimate_loser) },
      ],
    }), h("p", { class: "note" }, `${L.current_season} is in progress; its entries are leaders so far.`)),
    section("Young Sexy Awards", h("p", { class: "note" }, "Article XI: the top-scoring NFL rookie at each position over weeks 1-17, under iooi scoring. The team shown held his rights at season's end."),
      statTable({
        sortable: false,
        rows: awards.flatMap((a) => a.young_sexy.map((y) => ({ ...y, season: a.season, complete: a.complete }))),
        columns: [
          { label: "Season", value: (y) => y.season },
          { label: "Pos", value: (y) => y.pos, cls: "c" },
          { label: "Winner", render: (y) => (y.player ? pLink(y.player, y.name) : y.name), cls: "win" },
          { label: "Pts", render: (y) => fmt.pts(y.pts), num: true },
          { label: "Team", render: (y) => (y.franchise ? fLink(y.franchise, y.team) : "Unrostered") },
          { label: "Status", render: (y) => (!y.complete ? "Leader, season in progress" : y.official ? (y.matches_official ? "Official" : `Official winner: ${y.official}`) : "Computed") },
        ],
      })),
    section("Most Valuable Player", h("p", { class: "note" }, "Ranked by points above average (PAA): each start measured against the average iooi starter at the same position that week. Only games in an iooi starting lineup count, and a player needs the same minimum starts as the All-iooi teams: 8 in a complete season, half the weeks played so far while one is in progress."),
      statTable({
        sortable: false,
        rows: awards.flatMap((a) => rank(a.mvp, (r) => r.paa).map((r) => ({ ...r, season: a.season, place: r.rk }))),
        rowClass: (r) => (r.place === 1 ? "champ" : null),
        columns: [
          { label: "Season", value: (r) => r.season },
          { label: "Rk", value: (r) => r.place, num: true },
          { label: "Player", render: (r) => pLink(r.player, name(r.player)), cls: "win" },
          { label: "Pos", value: (r) => r.pos, cls: "c" },
          { label: "Team(s)", render: teams },
          { label: "GS", value: (r) => r.gs, num: true },
          { label: "Pts", render: (r) => fmt.pts(r.pts), num: true },
          { label: "PAA", render: (r) => fmt.signed(r.paa), num: true },
        ],
      })),
    awards.map((a) => section(`${a.season} All-iooi Teams`,
      h("p", { class: "note" }, `The best lineup by points above average (PAA) among players with at least ${a.all_iooi_min_starts} ${a.all_iooi_min_starts === 1 ? "start" : "starts"}${a.complete ? ", about half the 17 playable weeks" : ", half the weeks played so far (8 once the season is complete)"}. The First Team is chosen, then the Second Team from those left.`),
      h("div", { class: "box" }, a.all_iooi.map((squad) => h("div", {}, h("h3", {}, squad.label), statTable({
      sortable: false, rows: squad.picks,
      columns: [
        { label: "Slot", value: (r) => slot(r.slot) },
        { label: "Player", render: (r) => pLink(r.player, name(r.player)), cls: "win" },
        { label: "Team(s)", render: teams },
        { label: "GS", value: (r) => r.gs, num: true },
        { label: "Pts", render: (r) => fmt.pts(r.pts), num: true },
        { label: "PAA", render: (r) => fmt.signed(r.paa), num: true },
      ],
    })))))),
    section("Rookie of the Year", h("p", { class: "note" }, "NFL rookies ranked by points above average (PAA) as an iooi starter, with the same minimum starts as the MVP and All-iooi teams: 8 in a complete season, half the weeks played so far while one is in progress."), statTable({
      sortable: false,
      rows: awards.flatMap((a) => rank(a.rookie, (r) => r.paa).map((r) => ({ ...r, season: a.season, place: r.rk }))),
      rowClass: (r) => (r.place === 1 ? "champ" : null),
      columns: [
        { label: "Season", value: (r) => r.season }, { label: "Rk", value: (r) => r.place, num: true },
        { label: "Player", render: (r) => pLink(r.player, name(r.player)), cls: "win" }, { label: "Pos", value: (r) => r.pos, cls: "c" },
        { label: "Team(s)", render: teams }, { label: "GS", value: (r) => r.gs, num: true }, { label: "Pts", render: (r) => fmt.pts(r.pts), num: true },
        { label: "PAA", render: (r) => fmt.signed(r.paa), num: true },
      ],
    })));
});
</script>
</body>
</html>
