<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Hall of Fame | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Hall of Fame", async (main) => {
  const [hof, players] = await Promise.all([load("hall_of_fame"), load("players")]);
  main.append(
    h("h1", {}, "Dynasty iooi Hall of Fame"),
    meta([["Members", hof.inductees.length], ["Founded", L.founded], ["First class", hof.inductees.length ? Math.min(...hof.inductees.map((x) => x.class)) : "Not yet elected"]]),
    hof.inductees.length ? section("Members", statTable({
      rows: hof.inductees,
      columns: [
        { label: "Class", value: (r) => r.class, num: true, title: "Year of induction" },
        { label: "Player", value: (r) => players[r.player]?.name ?? r.player, render: (r) => pLink(r.player, players[r.player]?.name ?? r.player), cls: "win" },
        { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" },
        { label: "Vote", value: (r) => r.votes ?? "", cls: "c", title: "Managers for and against" },
        { label: "GS", value: (r) => players[r.player]?.gs, num: true },
        { label: "Pts", value: (r) => players[r.player]?.pts, render: (r) => fmt.pts(players[r.player]?.pts), num: true },
        { label: "WAR", value: (r) => players[r.player]?.war, render: (r) => fmt.pts(players[r.player]?.war), num: true },
        { label: "Citation", render: (r) => h("div", {}, r.citation ?? ""), title: "Why he was elected" },
      ],
    })) : h("div", { class: "plaque" }, h("b", {}, "The hall is empty."), `Dynasty iooi is in its ${ordinal(L.seasons.length)} season, and no player has been on the ballot yet.`),
    section("Hall of Fame Monitor", h("p", { class: "note" }, `A rough measure of how strong a case each player has built, after the monitor on the reference sites. ${hof.benchmark} marks a strong candidate. It is a guide for the ballot, not the ballot.`),
      statTable({
        rows: rank(hof.candidates),
        columns: [
          { label: "Rk", value: (r) => r.rk, num: true },
          { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name), cls: activeCls(players) },
          { label: "Pos", value: (r) => r.pos, cls: "c" },
          { label: "Status", value: (r) => `${statusOrder[players[r.player]?.status?.code]} ${statusText(players[r.player]?.status, false)}`, render: (r) => statusText(players[r.player]?.status), cls: (r) => (players[r.player]?.status?.code === "out" ? "dim" : null) },
          { label: "Monitor", value: (r) => r.score, render: (r) => r.score.toFixed(1), num: true, cls: (r) => (r.score >= hof.benchmark ? "win ahead" : "win"), title: `Hall of Fame Monitor: the sum of the four columns to the right. ${hof.benchmark} marks a strong candidate.` },
          { label: "Value", value: (r) => r.war, render: (r) => r.war.toFixed(1), num: true, title: `${hof.weights.war} points per career win above replacement` },
          { label: "Service", value: (r) => r.starts, render: (r) => r.starts.toFixed(1), num: true, title: `${hof.weights.start} points per start` },
          { label: "Black Ink", value: (r) => r.black_ink, render: (r) => r.black_ink.toFixed(1), num: true, title: "His Black Ink score: seasons leading the league" },
          { label: "Honors", value: (r) => r.awards, render: (r) => r.awards.toFixed(1), num: true, title: `MVP ${hof.weights.mvp}, All-iooi First Team ${hof.weights.first_team}, Second Team ${hof.weights.second_team}, title as a starter in the final ${hof.weights.champion}, title as a regular ${hof.weights.champion_regular}, Championship MVP ${hof.weights.championship_mvp}, Young Sexy ${hof.weights.young_sexy}, Rookie of the Year ${hof.weights.rookie_of_year}` },
          { label: "Yrs", value: (r) => r.seasons, num: true, title: "Seasons with at least one start" },
          { label: "GS", value: (r) => r.gs, num: true },
          { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
          { label: "WAR", value: (r) => r.career_war, render: (r) => fmt.pts(r.career_war), num: true },
          { label: "Awards", render: (r) => [["mvp", "MVP"], ["championship_mvp", "Champ MVP"], ["first_team", "1st Team"], ["second_team", "2nd Team"], ["champion", "Champ (started final)"], ["champion_regular", "Champ (regular)"], ["champion_bench", "Champ (bench)"], ["young_sexy", "Young Sexy"], ["rookie_of_year", "ROY"]].filter(([k]) => r.honors[k]).map(([k, label]) => `${r.honors[k]}x ${label}`).join(", "), title: "Honors counted in the Honors column" },
        ],
      }),
      h("p", { class: "note" }, `Monitor = Value (${hof.weights.war} per WAR) + Service (${hof.weights.start} per start) + Black Ink + Honors (MVP ${hof.weights.mvp}, First Team ${hof.weights.first_team}, Second Team ${hof.weights.second_team}, Young Sexy ${hof.weights.young_sexy}, Rookie of the Year ${hof.weights.rookie_of_year}, Championship MVP ${hof.weights.championship_mvp}, and a championship: ${hof.weights.champion} for starting the title game, ${hof.weights.champion_regular} for a player on the title roster who started at least half the team's games that season but not the final, nothing for a bench player). The weights are a first pass and open to revision.`)),
    section("Election", h("div", { class: "prose" },
      h("p", {}, "Players will enter the Hall of Fame by vote of the league's managers. Managers nominate candidates, and the league votes on each one."),
      h("p", {}, "The rules for nomination, eligibility and the number of votes needed have not been set. They will be recorded here, and in the constitution if adopted by amendment, before the first ballot."),
      h("p", {}, ["Until then, the ", h("a", { href: "leaders.html" }, "career leaders"), ", the ", h("a", { href: "awards.html" }, "awards page"), " and the ", h("a", { href: "records.html" }, "record book"), " hold the case for every candidate."]))));
});
</script>
</body>
</html>
