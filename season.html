<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Season | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://radurbin.github.io/iooi-reference/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Season", async (main) => {
  const y = param("y") || L.current_season;
  const [season, allTrades, waivers, players] = await Promise.all([load(`seasons/${y}`), load("trades"), load("waivers"), load("players")]);
  const trades = allTrades.filter((t) => t.season === y);
  const info = L.seasons.find((s) => s.season === y);
  const name = (id) => fLink(id, info.teams[id]);
  const complete = season.status === "complete";
  const started = season.games.length > 0;
  const side = (g, won) => g.teams.find((t) => (t.franchise === g.winner) === won);
  const bracket = (kind, note) => {
    const games = season.games.filter((g) => g.kind === kind);
    if (!games.length) return h("p", { class: "note" }, "Not yet played.");
    return [statTable({
      sortable: false, rows: games,
      columns: [
        { label: "Week", value: (g) => g.week, num: true },
        { label: "Round", value: (g) => g.label },
        { label: "Winner", render: (g) => name(side(g, true).franchise), cls: "win" },
        { label: "Pts", render: (g) => fmt.pts(side(g, true).points), num: true },
        { label: "Loser", render: (g) => name(side(g, false).franchise) },
        { label: "Pts", render: (g) => fmt.pts(side(g, false).points), num: true },
        { label: "", render: (g) => gLink(g.id, "box score") },
      ],
    }), note && h("p", { class: "note" }, note)];
  };
  const weeks = [...new Set(season.games.filter((g) => g.kind === "regular").map((g) => g.week))];
  main.append(
    h("h1", {}, `${y} Dynasty iooi Season`),
    meta([
      ["Status", complete ? "Complete" : started ? `In progress, ${season.weeks_played} ${season.weeks_played === 1 ? "week" : "weeks"} played` : "Not yet started"],
      ["Champion", complete && name(season.champion)],
      ["Runner-up", complete && name(season.runner_up)],
      ["Ultimate Loser", complete && name(season.ultimate_loser)],
    ]),
    !started ? h("p", { class: "note" }, `The ${y} season has not started. Standings, leaders and results will appear after week 1. Offseason trades and pickups are below.`) : null,
    started ? [
    section("League Leaders", leaderBoxes(season.leaders, (r) => pLink(r.player, r.name)),
      h("p", { class: "note" }, ["Starts in iooi lineups, playoffs and Toilet Bowl included. Full lists are on the ", h("a", { href: "leaders.html" }, "leaders page"), "."])),
    section("Regular Season Standings", statTable({
      rows: season.standings, rowClass: (r) => (r.finish === 1 ? "champ" : null),
      columns: [
        { label: "Seed", value: (r) => r.seed, num: true },
        { label: "Team", value: (r) => r.team, render: (r) => tsLink(y, r.franchise, r.team) },
        { label: "W", value: (r) => r.w, num: true },
        { label: "L", value: (r) => r.l, num: true },
        { label: "W-L%", value: (r) => r.pct, render: (r) => fmt.pct(r.pct), num: true },
        { label: "PF", value: (r) => r.pf, render: (r) => fmt.pts(r.pf), num: true },
        { label: "PA", value: (r) => r.pa, render: (r) => fmt.pts(r.pa), num: true },
        { label: "PF/G", value: (r) => r.ppg, render: (r) => fmt.pts(r.ppg), num: true },
        { label: "Max PF", value: (r) => r.max_pf, render: (r) => fmt.pts(r.max_pf), num: true, title: "Points from the best possible lineup each week" },
        { label: "Eff", value: (r) => r.efficiency, render: (r) => fmt.eff(r.efficiency), num: true, title: "Points for as a share of Max PF" },
        { label: "All-Play", value: (r) => r.all_play_w, render: (r) => `${r.all_play_w}-${r.all_play_l}`, num: true, title: "Record against every team every week" },
        { label: "xW", value: (r) => r.expected_w, render: (r) => fmt.pts(r.expected_w), num: true, title: "Expected wins from all-play results" },
        { label: "Luck", value: (r) => r.luck, render: (r) => fmt.signed(r.luck), num: true, title: "Wins minus expected wins" },
        { label: "Trans", value: (r) => r.transactions, num: true },
        { label: "Finish", value: (r) => r.finish, render: (r) => r.result ?? "", cls: "c" },
      ],
    }), h("p", { class: "note" }, "Seeds 1-6 make the Dynasty Playoffs; 7-12 play the Toilet Bowl. Ties in record are broken by points for. Click a team for its season page.")),
    section("Dynasty Playoffs", bracket("winners", "Seeds 1 and 2 have a first-round bye.")),
    section("Toilet Bowl", bracket("toilet", "The loser of each Toilet Bowl game advances. The loser of the final is the Ultimate Loser.")),
    section("Schedule Swap", (() => {
      const order = season.standings.map((r) => r.franchise);
      const cell = (a, b) => season.schedule_swap[a][b];
      return [h("div", { class: "scroll" }, h("table", { class: "stats grid" },
        h("thead", {}, h("tr", {}, h("th", { "data-tip": "Each row shows the team's record had it played the numbered team's schedule" }, "Team, with the schedule of..."), order.map((id, i) => h("th", { "data-tip": info.teams[id] }, i + 1)), h("th", { "data-tip": "Best record under any team's schedule" }, "Best"), h("th", { "data-tip": "Worst record under any team's schedule" }, "Worst"))),
        h("tbody", {}, order.map((a, i) => {
          const actual = cell(a, a)[0];
          const all = order.map((b) => cell(a, b)[0]);
          return h("tr", {}, h("th", { class: "rowhead" }, `${i + 1}. `, name(a)),
            order.map((b) => { const [w, l] = cell(a, b); return h("td", { class: `c ${a === b ? "self win" : w > actual ? "ahead" : w < actual ? "behind" : ""}` }, `${w}-${l}`); }),
            h("td", { class: "c" }, `${Math.max(...all)}-${cell(a, order[all.indexOf(Math.max(...all))])[1]}`),
            h("td", { class: "c" }, `${Math.min(...all)}-${cell(a, order[all.indexOf(Math.min(...all))])[1]}`));
        })))),
        h("p", { class: "note" }, "Each row is a team's record had it played another team's regular-season schedule with its own weekly scores. The shaded cell is the actual record; green is better than actual, red worse. Column numbers follow the row order.")];
    })()),
    ] : null,
    section("Trades", trades.length ? statTable({
      rows: trades,
      columns: [
        { label: "Date", value: (t) => t.date },
        { label: "When", value: (t) => t.week ?? 0, render: (t) => (t.week ? `Week ${t.week}` : "Offseason") },
        { label: "Terms", render: (t) => tradeTerms(t, players) },
        tradeStatus,
        { label: "", render: (t) => tLink(t.id, "details") },
      ],
    }) : h("p", { class: "note" }, "No trades yet."),
      h("p", { class: "note" }, [`${trades.filter((t) => t.status === "complete").length} completed trades in the ${y} league year, which runs from the end of the previous season. All seasons are in the `, h("a", { href: "trades.html" }, "trade register"), "."])),
    section("Waiver Wire", waivers.by_season[y] ? [statTable({
      rows: waivers.by_season[y],
      foot: { total: true, ...Object.fromEntries(["claims", "signings", "adds", "releases", "gs", "pts"].map((k) => [k, waivers.by_season[y].reduce((sum, r) => sum + r[k], 0)])) },
      columns: [
        { label: "Team", value: (r) => (r.total ? "" : info.teams[r.franchise]), render: (r) => (r.total ? "League" : tsLink(y, r.franchise)) },
        { label: "Claims", value: (r) => r.claims, num: true },
        { label: "FA Adds", value: (r) => r.signings, num: true },
        { label: "Adds", value: (r) => r.adds, num: true, title: "Waiver claims plus free-agent signings" },
        { label: "Releases", value: (r) => r.releases, num: true },
        { label: "GS", value: (r) => r.gs, num: true, title: "Starts made for the team by these pickups, in any season" },
        { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true, title: "Starter points for the team from these pickups, in any season" },
        { label: "Pts/Add", value: (r) => (r.adds ? r.pts / r.adds : null), render: (r) => (r.adds ? fmt.pts(r.pts / r.adds) : ""), num: true },
      ],
    }),
    h("h3", {}, `Best Pickups of ${y}`), statTable({
      rows: rank(waivers.best_by_season[y] ?? []),
      columns: [
        { label: "Rk", value: (r) => r.rk, num: true },
        { label: "Player", value: (r) => players[r.player]?.name, render: (r) => pLink(r.player, players[r.player]?.name) },
        { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" },
        { label: "Added", value: (r) => r.date },
        { label: "How", value: (r) => (r.type === "claim" ? "Waiver claim" : "Free agent") },
        { label: "Team", value: (r) => r.team, render: (r) => fLink(r.franchise, r.team) },
        { label: "Until", value: (r) => r.until, render: (r) => r.until ?? "still there" },
        { label: "GS", value: (r) => r.gs, num: true },
        { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
      ],
    }),
    h("p", { class: "note" }, ["A pickup is credited with what the player did as a starter for that team from the day he was added until he left it, in this season or later. Kickers and defenses are left off the best pickups list. Every move is in the ", h("a", { href: `transactions.html?y=${y}` }, `${y} transaction log`), "; all-time lists are on the ", h("a", { href: "waivers.html" }, "waiver wire page"), "."])] : h("p", { class: "note" }, "No waiver activity yet.")),
    started ? section("Schedule and Results", statTable({
      sortable: false,
      rows: season.games.filter((g) => g.kind === "regular"),
      columns: [
        { label: "Week", value: (g) => g.week, num: true },
        { label: "Date", value: (g) => g.date },
        { label: "Winner", render: (g) => name(side(g, true).franchise), cls: "win" },
        { label: "Pts", render: (g) => fmt.pts(side(g, true).points), num: true },
        { label: "Loser", render: (g) => name(side(g, false).franchise) },
        { label: "Pts", render: (g) => fmt.pts(side(g, false).points), num: true },
        { label: "", render: (g) => gLink(g.id, "box score") },
      ],
    }), h("p", { class: "note" }, `${weeks.length} of 14 regular-season weeks played. Dates are the Thursday that opens each week.`)) : null);
  return `${y} Season`;
});
</script>
</body>
</html>
