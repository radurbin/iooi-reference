<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Waiver Wire | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Waiver Wire", async (main) => {
  const [w, players] = await Promise.all([load("waivers"), load("players")]);
  const name = (id) => players[id]?.name ?? id;
  const rk = { label: "Rk", value: (r) => r.rk, num: true };
  const pickupCols = [
    rk,
    { label: "Player", value: (r) => name(r.player), render: (r) => pLink(r.player, name(r.player)), cls: "win" },
    { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" },
    { label: "Added", value: (r) => r.date },
    { label: "How", value: (r) => (r.type === "claim" ? "Waiver claim" : "Free agent") },
    { label: "Team", value: (r) => r.team, render: (r) => fLink(r.franchise, r.team) },
    { label: "Manager(s)", render: (r) => mLinks(r.managers) },
    { label: "Until", value: (r) => r.until, render: (r) => r.until ?? "still there" },
    { label: "GS", value: (r) => r.gs, num: true },
    { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
    { label: "Best", value: (r) => r.best, render: (r) => fmt.pts(r.best), num: true },
    { label: "W", value: (r) => r.wins, num: true, title: "Team wins in games he started" },
  ];
  const activityCols = (lead) => [
    lead,
    { label: "Adds", value: (r) => r.adds, num: true },
    { label: "Claims", value: (r) => r.claims, num: true, title: "Waiver claims won" },
    { label: "Signings", value: (r) => r.signings, num: true, title: "Free-agent signings" },
    { label: "Lost", value: (r) => r.failed_claims, num: true, title: "Waiver claims lost on priority or to a roster limit" },
    { label: "Releases", value: (r) => r.releases, num: true },
    { label: "GS", value: (r) => r.gs, num: true, title: "Games started by players added" },
    { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true, title: "Starter points from players added" },
    { label: "Pts/Add", value: (r) => r.pts_per_add, render: (r) => fmt.pts(r.pts_per_add), num: true },
  ];
  main.append(
    h("h1", {}, "Dynasty iooi Waiver Wire"),
    meta([["Players added", `${w.counts.pickups} (${w.counts.claims} waiver claims, ${w.counts.pickups - w.counts.claims} free-agent signings)`], ["Players released", w.counts.releases]]),
    h("p", { class: "note" }, "A pickup is credited with what the player did as a starter for that team from the day he was added until he left it. Waivers run on rolling priority; the league has no bidding."),
    section("Best Pickups", h("p", { class: "note" }, "Kickers and defenses have their own list below. They are also left out of the season lists, Worst Drops and Most Added Players, since they are picked up and dropped week to week."),
      statTable({ rows: rank(w.best, (r) => r.pts), columns: pickupCols })),
    section("Best Kicker and Defense Pickups", statTable({ rows: rank(w.best_kdef, (r) => r.pts), columns: pickupCols })),
    Object.entries(w.best_by_season).reverse().map(([season, rows]) => section(`Best Pickups of ${season}`, statTable({ rows: rank(rows, (r) => r.pts), columns: pickupCols }))),
    section("The Ones That Got Away", h("p", { class: "note" }, "Released players, ranked by what they went on to score as starters for other iooi franchises."), statTable({
      rows: rank(w.worst_drops, (r) => r.pts),
      columns: [
        rk,
        { label: "Player", value: (r) => name(r.player), render: (r) => pLink(r.player, name(r.player)), cls: "win" },
        { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" },
        { label: "Released", value: (r) => r.date },
        { label: "By", value: (r) => r.team, render: (r) => fLink(r.franchise, r.team) },
        { label: "Manager(s)", render: (r) => mLinks(r.managers) },
        { label: "Next started for", value: (r) => r.next_team, render: (r) => (r.next ? fLink(r.next, r.next_team) : "") },
        { label: "GS since", value: (r) => r.gs, num: true },
        { label: "Pts since", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
      ],
    })),
    section("Waiver Activity by Manager", statTable({ rows: mergeManagers(w.managers), columns: activityCols(mgrCol()) })),
    section("Waiver Activity by Franchise", statTable({ rows: w.franchises, columns: activityCols({ label: "Franchise", value: (r) => franchiseName(r.key), render: (r) => fLink(r.key) }) })),
    section("Most Added Players", statTable({
      rows: rank(w.most_added, (r) => r.added),
      columns: [rk, { label: "Player", value: (r) => name(r.player), render: (r) => pLink(r.player, name(r.player)) }, { label: "Pos", value: (r) => players[r.player]?.pos, cls: "c" },
        { label: "Added", value: (r) => r.added, num: true }, { label: "Released", value: (r) => r.released, num: true }],
    })));
});
</script>
</body>
</html>
