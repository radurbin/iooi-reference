<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iooi Reference</title>
<meta property="og:site_name" content="iooi Reference">
<meta property="og:type" content="website">
<meta property="og:title" content="Team Season | iooi Reference">
<meta property="og:description" content="Dynasty iooi stats, history and records since 2023.">
<meta property="og:image" content="https://dynastyiooi.com/assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="description" content="Dynasty iooi stats, history and records since 2023.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js"></script>
<script>
page("Team Season", async (main) => {
  const y = param("y") || L.current_season, id = Number(param("id") || 1);
  const [t, allTrades, players] = await Promise.all([load(`teams/${y}-${id}`), load("trades"), load("players")]);
  const trades = allTrades.filter((x) => x.season === y && x.sides.some((s) => Number(s.franchise) === Number(id)));
  const pName = (r) => players[r.player]?.name ?? r.name ?? r.player;
  // A player added and dropped between games has no page of his own.
  const pCell = (r) => (players[r.player] ? pLink(r.player, pName(r)) : pName(r));
  const r = t.row, k = t.ranks;
  const name = (pid) => t.players[pid] ?? pid;
  const years = L.seasons.map((s) => s.season);
  const title = `${y} ${t.team}`;
  const done = t.status === "complete";
  const stage = { regular: "", winners: "Playoffs", toilet: "Toilet Bowl" };
  const awards = [
    r.finish === 1 && done ? ["iooi Champ", y, "gold"] : null,
    r.finish === 2 && done ? ["Runner-up", y] : null,
    done && r.seed <= 6 ? ["Playoffs", y] : null,
    done && r.seed === 1 ? ["Top Seed", y] : null,
    done && k.pf === 1 ? ["Scoring Title", y] : null,
    done && r.result === "Ultimate Loser" ? ["Ultimate Loser", y, "red"] : null,
  ].filter(Boolean);
  // Postseason results one to a line, in the manner of a reference-site team page.
  const bracket = (kind, label, w, l) => {
    const played = t.schedule.filter((g) => g.kind === kind);
    return played.length ? [`${label} (${w}-${l})`, played.map((g) => [h("br"), `${g.won ? "Won" : "Lost"} ${g.label} ${fmt.pts(g.pts)}-${fmt.pts(g.opp_pts)} versus `, tsLink(y, g.opp, g.opp_team), " (", gLink(g.id, "box score"), ")"])] : null;
  };
  const slotName = (s) => ({ SUPER_FLEX: "Superflex", FLEX: "Flex", DEF: "D/ST" }[s] ?? s);
  const list = (rows) => rows.flatMap((x, i) => [i ? ", " : "", pLink(x.player, name(x.player)), h("span", { class: "dim" }, ` (${x.gs})`)]);
  main.append(
    h("div", { class: "crumbs" }, h("a", { href: "index.html#franchises" }, "Franchises"), " › ", fLink(id), " › ", y),
    bio({
      name: title, awards,
      nav: [
        years.includes(String(y - 1)) ? tsLink(y - 1, id, `‹‹ Previous Season (${y - 1})`) : null,
        sLink(y, `League Season (${y})`),
        years.includes(String(+y + 1)) ? tsLink(+y + 1, id, `Next Season (${+y + 1}) ››`) : null,
      ],
      lines: [
        [["Record", `${record(r)}, ${ordinal(r.seed)} seed`], [done ? "Finish" : null, done ? r.result ?? ordinal(r.finish) : null]],
        ["Manager(s)", mLinks(t.managers)],
        [["Points For", `${fmt.pts(r.pf)} (${fmt.pts(r.ppg)}/g), ${ordinal(k.pf)} of 12`], ["Points Against", `${fmt.pts(r.pa)}, ${ordinal(k.pa)} fewest`]],
        [["Max PF", `${fmt.pts(r.max_pf)} (${ordinal(k.max_pf)})`], ["Lineup efficiency", `${fmt.eff(r.efficiency)} (${ordinal(k.efficiency)})`]],
        [["All-Play", `${r.all_play_w}-${r.all_play_l}`], ["Expected W-L", `${fmt.pts1(r.expected_w)}-${fmt.pts1(r.w + r.l - r.expected_w)}`], ["Luck", fmt.signed(r.luck)]],
        bracket("winners", `${y} Dynasty Playoffs`, r.playoff_w, r.playoff_l),
        bracket("toilet", `${y} Toilet Bowl`, r.toilet_w, r.toilet_l),
        [["Transactions", r.transactions], ["Trades", r.trades]],
        ["Also known as", t.aka.filter((n) => n !== t.team).join(", ")],
      ],
    }),
    t.awards?.length || t.record_entries?.length ? section("Awards and Records",
      t.awards?.length ? [h("h3", {}, "Awards"), statTable({
        sortable: false, rows: t.awards,
        columns: [
          { label: "Award", render: (a) => h("a", { href: "awards.html" }, a.award), cls: "win" },
          { label: "Player", render: (a) => (a.player ? pCell(a) : "Team") },
          { label: "Pos", render: (a) => (a.player ? players[a.player]?.pos ?? "" : ""), cls: "c" },
        ],
      })] : null,
      t.record_entries?.length ? [h("h3", {}, "Record Book Entries"), recordTable(t.record_entries, players, { rank: true, scope: "self" })] : null,
      h("p", { class: "note" }, [done ? "" : "Awards are given once the season is complete. ", "Record book entries are the top-ten places this team and its players set this season on the league's ",
        h("a", { href: "records.html" }, "record book"), " and ", h("a", { href: "leaders.html" }, "season leader"), " lists, and the franchise records it set, as they stand today. Team-season lists count complete seasons only."])) : null,
    section("Schedule and Results", statTable({
      sortable: false, rows: t.schedule,
      columns: [
        { label: "Week", value: (g) => g.week, num: true },
        { label: "Date", value: (g) => g.date },
        { label: "", render: (g) => gLink(g.id, "box score") },
        { label: "Result", render: (g) => (g.won ? "W" : "L"), cls: (g) => (g.won ? "c win" : "c"), title: "Win or loss" },
        { label: "Opp", render: (g) => tsLink(y, g.opp, g.opp_team) },
        { label: "Pts", render: (g) => fmt.pts(g.pts), num: true, title: "Points scored" },
        { label: "Opp Pts", render: (g) => fmt.pts(g.opp_pts), num: true },
        { label: "Rec", render: (g) => g.record ?? "", cls: "c" },
        { label: "Max PF", render: (g) => fmt.pts(g.max), num: true, title: "Points from the best possible lineup that week" },
        { label: "Top scorer", render: (g) => g.top && [pLink(g.top.player, name(g.top.player)), ` (${fmt.pts(g.top.pts)})`] },
        { label: "Stage", render: (g) => (g.kind === "regular" ? "" : g.label) },
      ],
    })),
    t.upcoming?.length ? section("Remaining Schedule", statTable({
      sortable: false, rows: t.upcoming,
      columns: [
        { label: "Week", value: (g) => g.week, num: true },
        { label: "Opp", render: (g) => tsLink(y, g.opp, g.opp_team) },
        { label: "Opp Rec", render: (g) => g.opp_record, cls: "c", title: "The opponent's record today" },
        { label: "Opp Seed", render: (g) => g.opp_seed, num: true, title: "The opponent's place in the standings today" },
        { label: "Proj", render: (g) => (g.proj == null ? "" : fmt.pts(g.proj)), num: true, title: "Sleeper's projection for the current lineup, this week only" },
        { label: "Opp Proj", render: (g) => (g.opp_proj == null ? "" : fmt.pts(g.opp_proj)), num: true },
        { label: "Win %", render: (g) => `${Math.round(g.chance * 100)}%`, num: true, title: "Chance of winning from the two teams' Elo ratings today" },
      ],
    }), h("p", { class: "note" }, ["Regular-season weeks still to play, from the Sleeper schedule. Win chances come from today's ",
      h("a", { href: "ratings.html" }, "Elo ratings"), "; projections are shown for the current week only."])) : null,
    section("Depth Chart", statTable({
      sortable: false, rows: t.depth,
      columns: [
        { label: "Slot", render: (d) => slotName(d.slot), cls: "win" },
        { label: "Primary starter(s)", render: (d) => list(d.players.slice(0, d.starters)), title: "Players with the most starts in the slot; starts in brackets" },
        { label: "Also started", render: (d) => h("div", {}, list(d.players.slice(d.starters))), title: "Everyone else who started in the slot; starts in brackets" },
      ],
    }), h("p", { class: "note" }, "Starts in each lineup slot across the regular season, playoffs and Toilet Bowl.")),
    section("Roster and Stats", statTable({
      rows: t.roster,
      columns: [
        { label: "Player", value: (p) => name(p.player), render: (p) => pLink(p.player, name(p.player)), cls: "win" },
        { label: "Pos", value: (p) => p.pos, cls: "c" },
        { label: "NFL", value: (p) => p.nfl ?? (y === L.current_season ? players[p.player]?.nfl_team : null) ?? "", cls: "c", title: "NFL team or teams he played for that season" },
        { label: "G", value: (p) => p.g, num: true, title: "Weeks on the roster" },
        { label: "GS", value: (p) => p.gs, num: true },
        { label: "Pts", value: (p) => p.pts, render: (p) => fmt.pts(p.pts), num: true, title: "Points as a starter" },
        { label: "Pts/GS", value: (p) => p.ppg, render: (p) => fmt.pts(p.ppg), num: true },
        { label: "Best", value: (p) => p.best, render: (p) => fmt.pts(p.best), num: true },
        { label: "Bench Pts", value: (p) => p.bench_pts, render: (p) => fmt.pts(p.bench_pts), num: true },
        { label: "W", value: (p) => p.wins, num: true, title: "Team wins in games he started" },
        { label: "PAA", value: (p) => p.paa, render: (p) => fmt.pts1(p.paa), num: true },
        { label: "VOR", value: (p) => p.vor, render: (p) => fmt.pts1(p.vor), num: true },
        { label: "WAR", value: (p) => p.war, render: (p) => fmt.pts(p.war), num: true },
      ],
    }), h("p", { class: "note" }, y === L.current_season ? "Everyone who has spent a game week on the roster this season, then anyone added since (by trade, claim or signing) who has not yet, shown with a G of 0. Click a column to sort." : "Everyone who spent a week on the roster. Click a column to sort.")),
    t.best_games?.length ? section("Best Single Games", statTable({
      rows: rank(t.best_games, (r) => r.pts),
      columns: [
        { label: "Rk", value: (r) => r.rk, num: true },
        { label: "Player", value: (r) => r.name, render: (r) => pLink(r.player, r.name), cls: "win" },
        { label: "Pos", value: (r) => r.pos, cls: "c" },
        { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
        { label: "Week", value: (r) => r.week, render: (r) => gLink(r.game, `wk ${r.week}`), num: true },
      ],
    }), h("p", { class: "note" }, "The most points by a starter in one game this season, playoffs included.")) : null,
    t.draft.length ? section(`${y} ${t.draft_kind === "startup" ? "Startup" : "Rookie"} Draft`, statTable({
      sortable: false, rows: t.draft,
      columns: [
        { label: "Pick", render: (p) => p.label, num: true },
        { label: "Ovr", value: (p) => p.overall, num: true },
        { label: "Player", render: (p) => pLink(p.player, name(p.player)), cls: "win" },
        { label: "Pos", value: (p) => p.pos, cls: "c" },
        { label: "GS", value: (p) => p.starts_team, num: true, title: "Career starts for this franchise" },
        { label: "Pts", render: (p) => fmt.pts(p.pts_team), num: true, title: "Career starter points for this franchise" },
      ],
    }), h("p", { class: "note" }, ["See the full ", h("a", { href: `draft.html?y=${y}` }, `${y} draft`), "."])) : null,
    section("Trades", trades.length ? statTable({
      rows: trades,
      columns: [
        { label: "Date", value: (x) => x.date },
        { label: "When", value: (x) => x.week ?? 0, render: (x) => (x.week ? `Week ${x.week}` : "Offseason") },
        { label: "Terms", render: (x) => tradeTerms(x, players) },
        tradeStatus,
        { label: "", render: (x) => tLink(x.id, "details") },
      ],
    }) : h("p", { class: "note" }, `No trades in the ${y} league year.`)),
    section("Waiver Wire",
      meta([["Waiver claims", t.pickups.filter((p) => p.type === "claim").length], ["Free-agent adds", t.pickups.filter((p) => p.type !== "claim").length], ["Releases", t.drops.length],
        ["Starter points from pickups", fmt.pts(t.pickups.reduce((sum, p) => sum + p.pts, 0))]]),
      h("h3", {}, "Pickups"), t.pickups.length ? statTable({
        rows: t.pickups,
        columns: [
          { label: "Added", value: (r) => r.date },
          { label: "Player", value: pName, render: pCell },
          { label: "Pos", value: (r) => players[r.player]?.pos ?? r.pos, cls: "c" },
          { label: "How", value: (r) => (r.type === "claim" ? "Waiver claim" : "Free agent") },
          { label: "Until", value: (r) => r.until ?? "9999", render: (r) => r.until ?? "still there" },
          { label: "G", value: (r) => r.g, num: true, title: "Weeks on this team's roster during the stint" },
          { label: "GS", value: (r) => r.gs, num: true, title: "Starts for this team during the stint" },
          { label: "Pts", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true, title: "Starter points for this team during the stint" },
          { label: "Best", value: (r) => r.best, render: (r) => fmt.pts(r.best), num: true },
        ],
      }) : h("p", { class: "note" }, "None."),
      h("h3", { id: "releases" }, "Releases"), t.drops.length ? statTable({
        rows: t.drops,
        columns: [
          { label: "Released", value: (r) => r.date },
          { label: "Player", value: pName, render: pCell },
          { label: "Pos", value: (r) => players[r.player]?.pos ?? r.pos, cls: "c" },
          { label: "GS since", value: (r) => r.gs, num: true },
          { label: "Pts since", value: (r) => r.pts, render: (r) => fmt.pts(r.pts), num: true },
          { label: "Next started for", value: (r) => r.next_team ?? "", render: (r) => (r.next ? fLink(r.next, r.next_team) : "") },
        ],
      }) : h("p", { class: "note" }, "None."),
      h("p", { class: "note" }, "A pickup is credited with what the player did as a starter for this team from the day he was added until he left it, in this season or later. Releases show what the player went on to do as a starter for other iooi teams. Click a column to sort.")),
    t.similar.length ? section("Similar Seasons", statTable({
      sortable: false, rows: t.similar,
      columns: [
        { label: "Team", render: (x) => tsLink(x.season, x.franchise, `${x.season} ${x.team}`), cls: "win" },
        { label: "Sim", value: (x) => x.score, num: true },
        { label: "W", value: (x) => x.w, num: true },
        { label: "L", value: (x) => x.l, num: true },
        { label: "PF/G", render: (x) => fmt.pts(x.ppg), num: true },
        { label: "Finish", render: (x) => x.result ?? "", cls: "c" },
      ],
    }), h("p", { class: "note" }, "Team seasons most alike in win percentage, scoring and points allowed relative to the league that year, lineup efficiency and all-play record. 1000 would be identical.")) : null);
  return title;
});
</script>
</body>
</html>
